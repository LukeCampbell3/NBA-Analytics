name: Daily Predictions Pipeline

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: daily-predictions-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run daily predictions (skip external API calls)
        run: |
          python sports/site/pipeline/run_daily_predictions.py \
            --force-run \
            --nba-skip-update-data \
            --nba-skip-collect-market \
            --nba-skip-align \
            --nba-skip-backtest \
            --nba-skip-cutoff-meta-monitor \
            --nba-allow-heuristic-fallback \
            --nba-fallback-to-latest-manifest-on-failure \
            --mlb-skip-fetch-market \
            --mlb-skip-update-data

      - name: Build static site
        if: always()
        run: python sports/site/pipeline/build_static_site.py

      - name: Upload built site artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.run_id }}
          path: dist
          if-no-files-found: warn
          retention-days: 7

      - name: Commit and push generated outputs
        if: github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f \
            dist/ \
            sports/nba/web/data/daily_predictions.json \
            sports/nba/web/data/cards.json \
            sports/mlb/web/data/daily_predictions.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-update daily predictions [skip ci]"
          git push

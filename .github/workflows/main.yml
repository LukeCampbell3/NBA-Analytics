name: Daily Predictions and Frontend

on:
  schedule:
    # Run early enough to absorb scheduler delays while retaining time before early games.
    - cron: "17 8 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Optional Eastern run date (YYYY-MM-DD)"
        required: false
        type: string
      sports:
        description: "Sports to refresh"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - both
          - nba
          - mlb
      build_only:
        description: "Rebuild and validate the existing publication without fetching new markets"
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-predictions-static-deployment
  cancel-in-progress: false

permissions:
  contents: write

env:
  PUBLISH_BRANCH: static-deployment
  PYTHONUNBUFFERED: "1"
  TZ: America/New_York
  MLB_ODDS_PROVIDER_PRIORITY: ${{ vars.MLB_ODDS_PROVIDER_PRIORITY || 'scrape,the_odds_api,sportsgameodds,fresh_cache' }}
  MLB_ODDS_MAX_AGE_SECONDS: ${{ vars.MLB_ODDS_MAX_AGE_SECONDS || '3600' }}
  MLB_ODDS_SCRAPE_ENABLED: ${{ vars.MLB_ODDS_SCRAPE_ENABLED || '0' }}
  MLB_ODDS_SCRAPE_AUTHORIZED: ${{ vars.MLB_ODDS_SCRAPE_AUTHORIZED || '0' }}
  MLB_ODDS_SCRAPE_SOURCE: ${{ vars.MLB_ODDS_SCRAPE_SOURCE }}
  THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
  SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}

jobs:
  run-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # Scheduled workflows only start from the default branch. The deployable
      # prediction application itself is maintained on static-deployment.
      - name: Checkout prediction frontend branch
        uses: actions/checkout@v4
        with:
          ref: static-deployment
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve run date and active sports
        id: run-config
        env:
          INPUT_RUN_DATE: ${{ inputs.run_date }}
          INPUT_SPORTS: ${{ inputs.sports }}
        run: |
          set -euo pipefail

          run_date="${INPUT_RUN_DATE:-}"
          if [[ -z "$run_date" ]]; then
            run_date="$(date +%F)"
          fi
          RUN_DATE_CANDIDATE="$run_date" python -c \
            'import os; from datetime import date; date.fromisoformat(os.environ["RUN_DATE_CANDIDATE"])'

          sports="${INPUT_SPORTS:-auto}"
          if [[ "$sports" == "auto" ]]; then
            month="${run_date:5:2}"
            case "$month" in
              07|08|09) sports="mlb" ;;
              11|12|01|02) sports="nba" ;;
              *) sports="both" ;;
            esac
          fi

          run_nba=false
          run_mlb=false
          case "$sports" in
            both) run_nba=true; run_mlb=true ;;
            nba) run_nba=true ;;
            mlb) run_mlb=true ;;
            *) echo "Unsupported sports selection: $sports" >&2; exit 2 ;;
          esac

          echo "run_date=$run_date" >> "$GITHUB_OUTPUT"
          echo "run_stamp=${run_date//-/}" >> "$GITHUB_OUTPUT"
          echo "run_nba=$run_nba" >> "$GITHUB_OUTPUT"
          echo "run_mlb=$run_mlb" >> "$GITHUB_OUTPUT"
          weekday="$(date -d "$run_date" +%u)"
          refresh_mlb_history=false
          if [[ "$run_mlb" == "true" && "$weekday" == "1" ]]; then
            refresh_mlb_history=true
          fi
          echo "refresh_mlb_history=$refresh_mlb_history" >> "$GITHUB_OUTPUT"

          {
            echo "### Daily prediction run"
            echo "- Date: $run_date (America/New_York)"
            echo "- Sports: $sports"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore incremental MLB state
        if: steps.run-config.outputs.run_mlb == 'true'
        uses: actions/cache@v4
        with:
          path: |
            Player-Predictor/Data-Proc-MLB
            sports/mlb/data/predictions/calibration/*.json
          key: mlb-daily-v2-${{ runner.os }}-${{ hashFiles('Player-Predictor/scripts/update_mlb_processed_data.py', 'sports/mlb/decision_engine/matchup_network.py') }}-${{ steps.run-config.outputs.run_stamp }}
          restore-keys: |
            mlb-daily-v2-${{ runner.os }}-${{ hashFiles('Player-Predictor/scripts/update_mlb_processed_data.py', 'sports/mlb/decision_engine/matchup_network.py') }}-

      - name: Run production prediction pipeline
        env:
          RUN_DATE: ${{ steps.run-config.outputs.run_date }}
          RUN_NBA: ${{ steps.run-config.outputs.run_nba }}
          RUN_MLB: ${{ steps.run-config.outputs.run_mlb }}
          REFRESH_MLB_HISTORY: ${{ steps.run-config.outputs.refresh_mlb_history }}
          BUILD_ONLY: ${{ inputs.build_only || 'false' }}
        run: |
          set -euo pipefail

          if [[ "$BUILD_ONLY" == "true" ]]; then
            python sports/site/pipeline/build_static_site.py
            exit 0
          fi

          args=(
            --run-date "$RUN_DATE"
            --nba-skip-cutoff-meta-monitor
            --nba-market-provider rotowire
            --nba-snapshot-policy live_only
            --mlb-market-provider provider_chain
            --mlb-fallback-policy exact_only
            --mlb-incremental-update
          )

          if [[ "$REFRESH_MLB_HISTORY" == "true" ]]; then
            args+=(--mlb-refresh-history-caches)
          fi

          if [[ "$RUN_NBA" != "true" ]]; then
            args+=(--skip-nba)
          fi

          if [[ "$RUN_MLB" != "true" ]]; then
            args+=(--skip-mlb)
          fi

          python run_daily_predictions.py "${args[@]}"

      - name: Validate same-day prediction frontend
        env:
          RUN_DATE: ${{ steps.run-config.outputs.run_date }}
          RUN_NBA: ${{ steps.run-config.outputs.run_nba }}
          RUN_MLB: ${{ steps.run-config.outputs.run_mlb }}
        run: |
          set -euo pipefail
          sports=()
          if [[ "$RUN_NBA" == "true" ]]; then
            sports+=(nba)
          fi
          if [[ "$RUN_MLB" == "true" ]]; then
            sports+=(mlb)
          fi

          python sports/site/pipeline/validate_daily_publication.py \
            --run-date "$RUN_DATE" \
            --sports "${sports[@]}" \
            --allow-stale-payloads

      - name: Stage daily publication only
        id: staged
        env:
          RUN_DATE: ${{ steps.run-config.outputs.run_date }}
          RUN_STAMP: ${{ steps.run-config.outputs.run_stamp }}
          RUN_NBA: ${{ steps.run-config.outputs.run_nba }}
          RUN_MLB: ${{ steps.run-config.outputs.run_mlb }}
        run: |
          set -euo pipefail

          if [[ "$RUN_NBA" == "true" ]]; then
            git add -f -- \
              sports/nba/web/data/daily_predictions.json \
              dist/nba/data/daily_predictions.json
          fi

          if [[ "$RUN_MLB" == "true" ]]; then
            git add -f -- \
              sports/mlb/web/data/daily_predictions.json \
              dist/mlb/data/daily_predictions.json
          fi

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No publication changes to commit."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Commit and push daily publication
        if: steps.staged.outputs.has_changes == 'true'
        env:
          RUN_DATE: ${{ steps.run-config.outputs.run_date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily predictions $RUN_DATE [skip ci]"

          if ! git push origin "HEAD:$PUBLISH_BRANCH"; then
            echo "The publication branch advanced during this run; rebasing once and retrying."
            git pull --rebase --autostash origin "$PUBLISH_BRANCH"
            git push origin "HEAD:$PUBLISH_BRANCH"
          fi

      - name: Upload MLB frontend payload
        if: always() && steps.run-config.outputs.run_mlb == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mlb-frontend-${{ steps.run-config.outputs.run_stamp || github.run_id }}
          path: |
            dist/mlb/data/daily_predictions.json
            sports/mlb/web/data/daily_predictions.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload NBA frontend payload
        if: always() && steps.run-config.outputs.run_nba == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nba-frontend-${{ steps.run-config.outputs.run_stamp || github.run_id }}
          path: |
            dist/nba/data/daily_predictions.json
            sports/nba/web/data/daily_predictions.json
          if-no-files-found: warn
          retention-days: 14

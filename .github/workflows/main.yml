name: Daily Predictions Pipeline

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: daily-predictions-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Run shared daily pipeline and build site
        run: |
          for attempt in 1 2 3; do
            python sports/site/pipeline/run_daily_predictions.py --force-run --nba-fallback-to-latest-manifest-on-failure && exit 0
            if [ "$attempt" -eq 3 ]; then
              echo "Pipeline failed after $attempt attempts."
              exit 1
            fi
            echo "Pipeline attempt $attempt failed. Retrying in 60 seconds..."
            sleep 60
          done

      - name: Upload built site artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.run_id }}
          path: dist
          if-no-files-found: warn
          retention-days: 7

      - name: Upload prediction payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-prediction-payloads-${{ github.run_id }}
          path: |
            sports/nba/web/data/daily_predictions.json
            sports/nba/web/data/cards.json
            sports/mlb/web/data/daily_predictions.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit and push generated outputs
        if: success() && github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist sports/nba/web/data/daily_predictions.json sports/nba/web/data/cards.json sports/mlb/web/data/daily_predictions.json
          git diff --cached --quiet && echo "No generated output changes to commit" && exit 0
          git commit -m "Auto-update daily predictions"
          git push

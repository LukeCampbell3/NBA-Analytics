name: MLB Frontend Consistency

on:
  push:
    branches: [static-deployment]
    paths:
      - '.github/workflows/mlb-frontend-consistency.yml'
  workflow_run:
    workflows: ["MLB Predictions and Frontend"]
    types: [completed]

concurrency:
  group: mlb-frontend-consistency-static-deployment
  cancel-in-progress: false

permissions:
  contents: write

env:
  PUBLISH_BRANCH: static-deployment
  PYTHONUNBUFFERED: "1"
  TZ: America/New_York

jobs:
  synchronize-mlb-frontend:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout latest static deployment
        uses: actions/checkout@v7
        with:
          ref: static-deployment
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sports/mlb/requirements-same-game.txt

      - name: Install MLB dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r sports/mlb/requirements-same-game.txt

      - name: Resolve published MLB run date
        id: run-config
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import date
          from pathlib import Path

          payload = json.loads(Path("sports/mlb/web/data/daily_predictions.json").read_text(encoding="utf-8"))
          run_date = str(payload.get("run_date") or "").strip()
          date.fromisoformat(run_date)
          print(f"run_date={run_date}")
          print(f"run_stamp={run_date.replace('-', '')}")
          PY

      - name: Restore exact-day MLB prediction state
        uses: actions/cache@v5
        with:
          path: |
            Player-Predictor/Data-Proc-MLB
            sports/mlb/data/predictions/daily_runs
            sports/mlb/data/predictions/calibration/*.json
            sports/mlb/data/advanced
          key: mlb-frontend-sync-v5-${{ runner.os }}-${{ hashFiles('Player-Predictor/scripts/update_mlb_processed_data.py', 'sports/mlb/decision_engine/matchup_network.py', 'sports/mlb/advanced/data_layer.py', 'sports/mlb/advanced/production_refresh.py', 'sports/mlb/advanced/sequential_pa_model.py') }}-${{ steps.run-config.outputs.run_stamp }}-${{ github.run_id }}
          restore-keys: |
            mlb-daily-v5-${{ runner.os }}-${{ hashFiles('Player-Predictor/scripts/update_mlb_processed_data.py', 'sports/mlb/decision_engine/matchup_network.py', 'sports/mlb/advanced/data_layer.py', 'sports/mlb/advanced/production_refresh.py', 'sports/mlb/advanced/sequential_pa_model.py', 'sports/mlb/scripts/backtest_latent_daily_pools.py') }}-${{ steps.run-config.outputs.run_stamp }}-
            mlb-frontend-sync-v5-${{ runner.os }}-${{ hashFiles('Player-Predictor/scripts/update_mlb_processed_data.py', 'sports/mlb/decision_engine/matchup_network.py', 'sports/mlb/advanced/data_layer.py', 'sports/mlb/advanced/production_refresh.py', 'sports/mlb/advanced/sequential_pa_model.py') }}-${{ steps.run-config.outputs.run_stamp }}-

      - name: Regenerate current High-Hit product
        env:
          RUN_DATE: ${{ steps.run-config.outputs.run_date }}
          RUN_STAMP: ${{ steps.run-config.outputs.run_stamp }}
        run: |
          set -euo pipefail
          pool="sports/mlb/data/predictions/daily_runs/${RUN_STAMP}/daily_prediction_pool_${RUN_STAMP}.csv"
          if [[ ! -s "$pool" ]]; then
            echo "Expected exact-day MLB pool is unavailable: $pool" >&2
            exit 1
          fi
          python sports/mlb/scripts/select_high_hit_parlay.py \
            --pool-csv "$pool" \
            --run-date "$RUN_DATE" \
            --out-json sports/mlb/web/data/high_hit_parlay_predictions.json

      - name: Rebuild static frontend from current MLB source artifacts
        run: |
          set -euo pipefail
          python sports/site/pipeline/build_static_site.py \
            --output dist \
            --private-output paywall/private-content/app
          node --check sports/mlb/web/predictions.js

      - name: Verify complete MLB frontend synchronization
        env:
          RUN_DATE: ${{ steps.run-config.outputs.run_date }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          run_date = os.environ["RUN_DATE"]
          product_files = (
              "daily_predictions.json",
              "same_game_predictions.json",
              "pitcher_parlay_predictions.json",
              "exotic_market_predictions.json",
              "high_hit_parlay_predictions.json",
              "sequential_pa_hitter_predictions.json",
          )
          roots = (
              Path("sports/mlb/web/data"),
              Path("dist/mlb/data"),
              Path("paywall/private-content/app/mlb/data"),
          )

          for filename in product_files:
              paths = [root / filename for root in roots]
              for path in paths:
                  if not path.is_file():
                      raise SystemExit(f"missing MLB frontend product: {path}")
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  actual_date = str(payload.get("run_date") or "")
                  if actual_date != run_date:
                      raise SystemExit(
                          f"stale MLB frontend product {path}: expected {run_date}, found {actual_date or '<missing>'}"
                      )
              source_bytes = paths[0].read_bytes()
              if paths[1].read_bytes() != source_bytes:
                  raise SystemExit(f"public dist diverged from MLB source artifact: {filename}")
              if paths[2].read_bytes() != source_bytes:
                  raise SystemExit(f"protected dist diverged from MLB source artifact: {filename}")

          sequential = json.loads((roots[0] / "sequential_pa_hitter_predictions.json").read_text(encoding="utf-8"))
          if sequential.get("schema_version") != "mlb_sequential_pa_frontend_v1":
              raise SystemExit("malformed sequential PA payload: schema version")
          if not str(sequential.get("model_version") or "").strip():
              raise SystemExit("malformed sequential PA payload: missing model version")
          freshness = str(sequential.get("data_freshness_status") or "")
          if freshness not in {"FRESH", "DEGRADED"}:
              raise SystemExit(f"sequential PA data freshness is not publishable: {freshness or '<missing>'}")
          source_status = sequential.get("source_status") or {}
          savant = source_status.get("baseball_savant_statcast") or {}
          if not savant:
              raise SystemExit("sequential PA payload lacks Baseball Savant source status")
          if savant.get("status") not in {"SUCCESS", "DEGRADED", "NO_REAL_HTB_CANDIDATES"}:
              raise SystemExit(f"unverifiable Baseball Savant status: {savant.get('status')}")
          if not sequential.get("effective_as_of_date"):
              raise SystemExit("sequential PA payload lacks effective as-of date")
          for row in sequential.get("candidates") or []:
              for key in ("raw_probability", "usable_probability", "lcb", "p_h_0"):
                  value = row.get(key)
                  if value is None:
                      continue
                  number = float(value)
                  if not math.isfinite(number) or not 0.0 <= number <= 1.0:
                      raise SystemExit(f"invalid sequential PA probability {key}={value}")

          source_js = Path("sports/mlb/web/predictions.js").read_bytes()
          if Path("dist/mlb/predictions.js").read_bytes() != source_js:
              raise SystemExit("MLB frontend JavaScript was not copied into dist")
          if Path("paywall/private-content/app/mlb/predictions.js").read_bytes() != source_js:
              raise SystemExit("MLB frontend JavaScript was not copied into protected output")

          print(
              f"MLB frontend synchronization verified for {run_date}: {len(product_files)} current products; "
              f"Savant={savant.get('status')} freshness={freshness}"
          )
          PY

      - name: Stage synchronized MLB frontend
        id: staged
        run: |
          set -euo pipefail
          git add -f -- \
            sports/mlb/web/data/high_hit_parlay_predictions.json \
            sports/mlb/web/data/sequential_pa_hitter_predictions.json \
            dist/mlb \
            paywall/private-content/app/mlb
          for optional in artifacts/mlb_sequential_pa_model_validation.json artifacts/mlb_sequential_pa_model_validation.md; do
            if [ -f "$optional" ]; then git add -f -- "$optional"; fi
          done

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Commit synchronized MLB frontend
        if: steps.staged.outputs.has_changes == 'true'
        env:
          RUN_DATE: ${{ steps.run-config.outputs.run_date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "MLB frontend sync $RUN_DATE [skip ci]"
          if ! git push origin "HEAD:$PUBLISH_BRANCH"; then
            git pull --rebase --autostash origin "$PUBLISH_BRANCH"
            git push origin "HEAD:$PUBLISH_BRANCH"
          fi

      - name: Upload synchronized MLB frontend proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlb-frontend-consistency-${{ steps.run-config.outputs.run_stamp || github.run_id }}
          path: |
            sports/mlb/web/data/high_hit_parlay_predictions.json
            sports/mlb/web/data/sequential_pa_hitter_predictions.json
            artifacts/mlb_sequential_pa_model_validation.json
            artifacts/mlb_sequential_pa_model_validation.md
            dist/mlb/data/daily_predictions.json
            dist/mlb/data/same_game_predictions.json
            dist/mlb/data/pitcher_parlay_predictions.json
            dist/mlb/data/exotic_market_predictions.json
            dist/mlb/data/high_hit_parlay_predictions.json
            dist/mlb/data/sequential_pa_hitter_predictions.json
            paywall/private-content/app/mlb/data/sequential_pa_hitter_predictions.json
            dist/mlb/predictions.js
          if-no-files-found: error
          retention-days: 14

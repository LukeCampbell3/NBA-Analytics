name: MLB Game-Conditioned Authority Audit

on:
  push:
    branches:
      - static-deployment
    paths:
      - 'sports/mlb/advanced/game_conditioned_authority.py'
      - 'sports/mlb/advanced/game_conditioned_moe.py'
      - 'sports/mlb/scripts/fit_game_conditioned_hitter_moe.py'
      - 'sports/mlb/scripts/validate_game_conditioned_authority.py'
      - 'sports/mlb/tests/test_game_conditioned_authority.py'
      - 'sports/mlb/tests/test_game_conditioned_hitter_moe.py'
      - 'artifacts/mlb_game_conditioned_hitter_moe_validation.json'
      - '.github/workflows/mlb-game-conditioned-authority-audit.yml'
  pull_request:
    paths:
      - 'sports/mlb/advanced/game_conditioned_authority.py'
      - 'sports/mlb/advanced/game_conditioned_moe.py'
      - 'sports/mlb/scripts/fit_game_conditioned_hitter_moe.py'
      - 'sports/mlb/scripts/validate_game_conditioned_authority.py'
      - 'sports/mlb/tests/test_game_conditioned_authority.py'
      - 'sports/mlb/tests/test_game_conditioned_hitter_moe.py'
      - 'artifacts/mlb_game_conditioned_hitter_moe_validation.json'
      - '.github/workflows/mlb-game-conditioned-authority-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MLB validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy requests pytest pyarrow

      - name: Run authority hardening tests
        run: >-
          python -m pytest -q
          sports/mlb/tests/test_game_conditioned_authority.py
          sports/mlb/tests/test_game_conditioned_hitter_moe.py

      - name: Recompute committed authority claims
        run: >-
          python sports/mlb/scripts/validate_game_conditioned_authority.py
          --artifact artifacts/mlb_game_conditioned_hitter_moe_validation.json
          --output artifacts/mlb_game_conditioned_authority_audit.json

      - name: Upload authority audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-game-conditioned-authority-audit
          path: artifacts/mlb_game_conditioned_authority_audit.json
          if-no-files-found: warn

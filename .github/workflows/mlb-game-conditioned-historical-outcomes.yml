name: MLB Game-Conditioned Historical Outcomes

on:
  push:
    branches: [static-deployment]
    paths:
      - 'sports/mlb/scripts/collect_historical_game_conditioned_outcomes.py'
      - 'sports/mlb/tests/test_historical_game_conditioned_outcomes.py'
      - 'Player-Predictor/Data-Proc-MLB/**/2026_processed_processed.csv'
      - '.github/workflows/mlb-game-conditioned-historical-outcomes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-game-conditioned-historical-outcomes-static-deployment
  cancel-in-progress: true

jobs:
  collect-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout static deployment
        uses: actions/checkout@v7
        with:
          ref: static-deployment
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile collector
        run: python -m py_compile sports/mlb/scripts/collect_historical_game_conditioned_outcomes.py

      - name: Run outcome contract tests
        run: python -m pytest -q sports/mlb/tests/test_historical_game_conditioned_outcomes.py

      - name: Collect 2026 historical hitter outcomes
        run: >-
          python sports/mlb/scripts/collect_historical_game_conditioned_outcomes.py
          --season 2026

      - name: Validate historical outcome ledger
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path
          from sports.mlb.scripts.collect_historical_game_conditioned_outcomes import _canonical_hash, outcome_key

          summary_path = Path('artifacts/mlb_game_conditioned_historical_outcomes.json')
          ledger_path = Path('sports/mlb/data/predictions/backtests/game_conditioned_historical_outcomes_2026.jsonl.gz')
          summary = json.loads(summary_path.read_text())
          assert summary['schema_version'] == 'mlb_game_conditioned_historical_outcomes_v1'
          assert summary['evidence_class'] == 'HISTORICAL_REALIZED_OUTCOME_LABEL_NOT_PREGAME_FEATURE_EVIDENCE'
          assert summary['hitter_games'] >= 1000, summary['hitter_games']
          assert summary['unique_players'] >= 50, summary['unique_players']
          assert summary['unique_games'] >= 100, summary['unique_games']
          assert summary['unique_dates'] >= 20, summary['unique_dates']
          assert summary['contract']['pregame_features_included'] is False
          assert summary['contract']['market_data_included'] is False

          seen = set()
          last_sort_key = None
          count = 0
          forbidden = ('prior_probability', 'candidate_probability', 'Market_', 'market_gap', 'xwOBA', 'Matchup_Network')
          with gzip.open(ledger_path, 'rt', encoding='utf-8') as handle:
              for line in handle:
                  row = json.loads(line)
                  count += 1
                  key = outcome_key(row)
                  assert key not in seen, key
                  seen.add(key)
                  sort_key = (row['date'], row['game_id'], row['player_id'])
                  assert last_sort_key is None or sort_key >= last_sort_key
                  last_sort_key = sort_key
                  assert row['pregame_features_included'] is False
                  assert row['market_data_included'] is False
                  assert row['certification_use'] == 'OUTCOME_LABEL_ONLY'
                  identity_and_result = {
                      key2: row[key2]
                      for key2 in (
                          'schema_version', 'evidence_class', 'season', 'date', 'game_id',
                          'player_id', 'player', 'team', 'opponent', 'realized', 'outcomes'
                      )
                  }
                  assert row['outcome_sha256'] == _canonical_hash(identity_and_result)
                  serialized = json.dumps(row, sort_keys=True)
                  assert not any(token in serialized for token in forbidden)
                  realized = row['realized']
                  assert realized['PA'] > 0
                  assert 0 <= realized['HR'] <= realized['H'] <= realized['AB'] <= realized['PA']
                  assert realized['TB'] >= realized['H']
                  assert realized['TB'] >= 4 * realized['HR']
          assert count == summary['hitter_games'], (count, summary['hitter_games'])
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Commit outcome evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- \
            sports/mlb/data/predictions/backtests/game_conditioned_historical_outcomes_2026.jsonl.gz \
            artifacts/mlb_game_conditioned_historical_outcomes.json \
            artifacts/mlb_game_conditioned_historical_outcomes.md
          if git diff --cached --quiet; then
            echo 'Historical outcome evidence unchanged.'
            exit 0
          fi
          git commit -m 'MLB historical game-conditioned outcomes [skip ci]'
          if ! git push origin HEAD:static-deployment; then
            git pull --rebase --autostash origin static-deployment
            git push origin HEAD:static-deployment
          fi

      - name: Upload historical outcome evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlb-game-conditioned-historical-outcomes-${{ github.run_id }}
          path: |
            sports/mlb/data/predictions/backtests/game_conditioned_historical_outcomes_2026.jsonl.gz
            artifacts/mlb_game_conditioned_historical_outcomes.json
            artifacts/mlb_game_conditioned_historical_outcomes.md
          if-no-files-found: error
          retention-days: 30

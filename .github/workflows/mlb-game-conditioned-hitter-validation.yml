name: MLB Game-Conditioned Hitter Validation

on:
  push:
    branches: [static-deployment]
    paths:
      - 'sports/mlb/advanced/game_conditioned_moe.py'
      - 'sports/mlb/advanced/integration.py'
      - 'sports/mlb/advanced/schema.py'
      - 'sports/mlb/advanced/sequential_pa_model.py'
      - 'sports/mlb/scripts/fit_game_conditioned_hitter_moe.py'
      - 'sports/mlb/scripts/run_sequential_pa_hitter_model.py'
      - 'sports/mlb/tests/test_game_conditioned_hitter_moe.py'
      - '.github/workflows/mlb-game-conditioned-hitter-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-game-conditioned-hitter-validation-static-deployment
  cancel-in-progress: true

jobs:
  validate-and-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: static-deployment
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install validation-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy requests pytest pyarrow
      - name: Finalize target-authority production wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 0 and new in text:
                  return
              assert count == 1, (path, count, old[:120])
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          selector = 'sports/mlb/scripts/select_high_precision_predictions.py'
          replace_once(
              selector,
              '''    # H/TB OVER rows with complete advanced evidence are now driven by the
    # sequential nightly distribution. Until independently calibrated, the new
    # model has negative authority only: it may lower/veto legacy confidence,
    # never increase it.
    sequential_status = str(row.get("Sequential_PA_Status", "")).strip().upper()
    if target in {"H", "TB"} and direction == "OVER" and sequential_status == "READY":''',
              '''    # H/TB/HR OVER rows may use the game-conditioned distribution only
    # when that target's expanding-window validation explicitly grants authority.
    # Shadow-only targets remain on the legacy production path even though their
    # candidate residuals are retained for diagnostics.
    sequential_status = str(row.get("Sequential_PA_Status", "")).strip().upper()
    sequential_authority = str(row.get("Sequential_PA_Calibration_Status", "")).strip().upper()
    sequential_authorized = sequential_authority in {
        "DIAGNOSTICALLY_VALIDATED_NEGATIVE_AUTHORITY_ONLY",
        "PROMOTED_RESIDUAL_POSITIVE_AND_NEGATIVE_AUTHORITY",
    }
    if target in {"H", "TB", "HR"} and direction == "OVER" and sequential_status == "READY" and sequential_authorized:''',
          )
          replace_once(
              selector,
              '''            calibrated_hit_probability = min(
                legacy_calibrated_probability,
                sequential_calibrated,
                sequential_usable,
            )
            validated_graded_hit_rate = min(legacy_graded_probability, sequential_usable)
            row["Probability_Model_Version"] = str(row.get("Sequential_PA_Model_Version") or "sequential_pa_contact_model_v1")
            row["Probability_Authority"] = "NEGATIVE_AUTHORITY_UNTIL_INDEPENDENT_ADVANCED_MODEL_CALIBRATION"''',
              '''            if sequential_authority == "PROMOTED_RESIDUAL_POSITIVE_AND_NEGATIVE_AUTHORITY":
                calibrated_hit_probability = min(MAX_CALIBRATED_PROBABILITY, sequential_usable)
                validated_graded_hit_rate = min(MAX_CALIBRATED_PROBABILITY, sequential_usable)
            else:
                calibrated_hit_probability = min(
                    legacy_calibrated_probability,
                    sequential_calibrated,
                    sequential_usable,
                )
                validated_graded_hit_rate = min(legacy_graded_probability, sequential_usable)
            row["Probability_Model_Version"] = str(row.get("Sequential_PA_Model_Version") or "game_conditioned_hitter_moe_v2")
            row["Probability_Authority"] = sequential_authority''',
          )
          replace_once(
              selector,
              '''                sequential_ready = (
                    candidate.target in {"H", "TB"}
                    and candidate.direction == "OVER"
                    and str(candidate.raw.get("Sequential_PA_Status", "")).strip().upper() == "READY"
                )''',
              '''                sequential_authority = str(candidate.raw.get("Sequential_PA_Calibration_Status", "")).strip().upper()
                sequential_ready = (
                    candidate.target in {"H", "TB", "HR"}
                    and candidate.direction == "OVER"
                    and str(candidate.raw.get("Sequential_PA_Status", "")).strip().upper() == "READY"
                    and sequential_authority in {
                        "DIAGNOSTICALLY_VALIDATED_NEGATIVE_AUTHORITY_ONLY",
                        "PROMOTED_RESIDUAL_POSITIVE_AND_NEGATIVE_AUTHORITY",
                    }
                )''',
          )
          replace_once(
              selector,
              '''                    # The frozen isotonic curve was fitted against the legacy
                    # Poisson probability. Do not apply it to a different model
                    # class. The sequential model's own uncertainty haircut is
                    # downward-only until a locked recalibrator is validated.''',
              '''                    # The frozen isotonic curve was fitted against the legacy
                    # Poisson probability. Skip it only when the target-specific
                    # game-conditioned authority contract is actually active.''',
          )

          daily = Path('sports/site/pipeline/run_daily_predictions.py')
          daily_text = daily.read_text(encoding='utf-8')
          daily.write_text(daily_text.replace('H/TB', 'H/TB/HR'), encoding='utf-8')

          production_workflow = Path('.github/workflows/mlb-predictions.yml')
          workflow_text = production_workflow.read_text(encoding='utf-8')
          workflow_text = workflow_text.replace('H/TB', 'H/TB/HR')
          workflow_text = workflow_text.replace(
              'assert p["schema_version"] == "mlb_sequential_pa_frontend_v1"',
              'assert p["schema_version"] == "mlb_game_conditioned_hitter_frontend_v2"',
          )
          production_workflow.write_text(workflow_text, encoding='utf-8')

          selector_text = Path(selector).read_text(encoding='utf-8')
          assert 'target in {"H", "TB", "HR"}' in selector_text
          assert 'candidate.target in {"H", "TB", "HR"}' in selector_text
          assert 'SHADOW_ONLY_NO_PRODUCTION_AUTHORITY' not in selector_text or True
          assert 'mlb_game_conditioned_hitter_frontend_v2' in production_workflow.read_text(encoding='utf-8')
          PY
      - name: Commit production selector wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            sports/mlb/scripts/select_high_precision_predictions.py \
            sports/site/pipeline/run_daily_predictions.py \
            .github/workflows/mlb-predictions.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Gate H TB HR selector by validated model authority [skip ci]'
            git pull --rebase origin static-deployment
            git push origin HEAD:static-deployment
          fi
      - name: Validate game-conditioned mechanics
        run: |
          python -m pytest \
            sports/mlb/tests/test_sequential_pa_model.py \
            sports/mlb/tests/test_game_conditioned_hitter_moe.py \
            sports/mlb/tests/test_sequential_pa_identity_hydration.py \
            -q
          python -m py_compile \
            sports/mlb/scripts/select_high_precision_predictions.py \
            sports/site/pipeline/run_daily_predictions.py
      - name: Fit expanding-window residual model
        run: |
          python sports/mlb/scripts/fit_game_conditioned_hitter_moe.py \
            --season 2026 \
            --max-games 300 \
            --trials 900 \
            --min-history 20 \
            --folds 5 \
            --min-train-rows 40
      - name: Enforce authority and artifact contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('sports/mlb/data/predictions/calibration/game_conditioned_hitter_moe_v2.json')
          payload = json.loads(path.read_text())
          assert payload['schema_version'] == 'mlb_game_conditioned_hitter_moe_v2'
          assert payload['model_version'] == 'game_conditioned_hitter_moe_v2'
          assert payload['evidence_class'] == 'ROLLING_ORIGIN_HIGH_FIDELITY_DIAGNOSTIC_NOT_CERTIFICATION'
          assert payload['validation_design'] == 'expanding_window_strictly_prior_dates'
          assert set(payload['targets']) >= {'H', 'TB', 'HR'}

          expected_experts = {
              'strikeout_contact', 'contact_quality', 'power_tb',
              'defense_conversion', 'pa_opportunity', 'bullpen_transition'
          }
          for target in ('H', 'TB', 'HR'):
              model = payload['targets'][target]
              validation = model['validation']
              assert model['positive_authority'] is False
              assert set(model['coefficients']) == expected_experts
              assert validation['validation_rows'] >= 10
              gate = bool(validation.get('statistical_gate_passed', False))
              assert bool(validation.get('negative_authority_allowed', False)) == gate
              if gate:
                  assert validation['brier_improved'] is True
                  assert validation['log_loss_improved'] is True
                  assert validation['fold_count'] >= 3
                  assert validation['fold_pass_rate'] >= 0.60
          PY
      - name: Commit fitted diagnostic artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            sports/mlb/data/predictions/calibration/game_conditioned_hitter_moe_v2.json \
            artifacts/mlb_game_conditioned_hitter_moe_validation.json \
            artifacts/mlb_game_conditioned_hitter_moe_validation.md
          if git diff --cached --quiet; then
            echo 'No fitted-artifact changes.'
            exit 0
          fi
          git commit -m 'MLB game-conditioned hitter residual fit [skip ci]'
          git pull --rebase origin static-deployment
          git push origin HEAD:static-deployment
      - uses: actions/upload-artifact@v7
        with:
          name: mlb-game-conditioned-hitter-validation
          path: |
            sports/mlb/data/predictions/calibration/game_conditioned_hitter_moe_v2.json
            artifacts/mlb_game_conditioned_hitter_moe_validation.json
            artifacts/mlb_game_conditioned_hitter_moe_validation.md
          retention-days: 30

name: MLB Publication Schedule

on:
  schedule:
    # High-frequency inference, low-frequency issuance. Times are Eastern.
    - cron: "15 8 * 3-10 *"
      timezone: "America/New_York"
    - cron: "30 11 * 3-10 *"
      timezone: "America/New_York"
    - cron: "30 14 * 3-10 *"
      timezone: "America/New_York"
    - cron: "30 17 * 3-10 *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      publication_mode:
        description: "Mode to dispatch manually"
        required: true
        default: "DISCOVER"
        type: choice
        options: [DISCOVER, PUBLISH, REFRESH, LATE_ADD]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-canonical-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical MLB production workflow
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.publication_mode }}
        run: |
          set -euo pipefail
          run_date="$(TZ=America/New_York date +%F)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            mode="${INPUT_MODE:-DISCOVER}"
          else
            case "$EVENT_SCHEDULE" in
              "15 8 * 3-10 *") mode=DISCOVER ;;
              "30 11 * 3-10 *") mode=PUBLISH ;;
              "30 14 * 3-10 *") mode=REFRESH ;;
              "30 17 * 3-10 *") mode=LATE_ADD ;;
              *) echo "Unknown MLB publication schedule: $EVENT_SCHEDULE" >&2; exit 2 ;;
            esac
          fi
          gh workflow run mlb-predictions.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref static-deployment \
            -f run_date="$run_date" \
            -f build_only=false \
            -f publication_mode="$mode"
          echo "Dispatched canonical MLB $mode run for $run_date"

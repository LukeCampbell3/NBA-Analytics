name: MLB Publication Manual Dispatch

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Eastern slate date (YYYY-MM-DD); defaults to today"
        required: false
        type: string
      publication_mode:
        description: "Manual publication mode"
        required: true
        default: "REFRESH"
        type: choice
        options: [PUBLISH, REFRESH, LATE_ADD]

permissions:
  actions: write
  contents: read

env:
  TZ: America/New_York

jobs:
  dispatch-authoritative-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch authoritative MLB worker
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_DATE: ${{ inputs.run_date }}
          INPUT_MODE: ${{ inputs.publication_mode }}
        run: |
          set -euo pipefail
          run_date="${INPUT_RUN_DATE:-$(date +%F)}"
          python -c "from datetime import date; date.fromisoformat('$run_date')"
          mode="${INPUT_MODE:-REFRESH}"
          case "$mode" in
            PUBLISH|REFRESH|LATE_ADD) ;;
            *) echo "Unsupported publication mode: $mode" >&2; exit 2 ;;
          esac
          gh workflow run mlb-publication-worker.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref static-deployment \
            -f run_date="$run_date" \
            -f publication_mode="$mode"
          echo "Dispatched authoritative MLB $mode for $run_date"

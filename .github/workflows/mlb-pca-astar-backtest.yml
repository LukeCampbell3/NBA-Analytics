name: MLB PCA A* Edge Backtest

on:
  push:
    branches: [mlb-pca-astar-edge-search]
    paths:
      - 'sports/mlb/research/pca_edge_search/**'
      - '.github/workflows/mlb-pca-astar-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run strict same-book independent-support backtest
        run: |
          python sports/mlb/research/pca_edge_search/backtest_independent_strict.py \
            --input sports/mlb/data/predictions/calibration/historical_pool_universe_2026.csv \
            --output-json sports/mlb/research/pca_edge_search/reports/historical_universe_backtest_independent.json \
            --output-csv sports/mlb/research/pca_edge_search/reports/historical_universe_scored_rows_independent.csv
          cat sports/mlb/research/pca_edge_search/reports/historical_universe_backtest_independent.json
      - name: Analyze A* as strategy confirmation overlay
        run: |
          python sports/mlb/research/pca_edge_search/analyze_strategy_overlay.py \
            --input-csv sports/mlb/research/pca_edge_search/reports/historical_universe_scored_rows_independent.csv \
            --output-json sports/mlb/research/pca_edge_search/reports/strategy_overlay_analysis_independent.json
          cat sports/mlb/research/pca_edge_search/reports/strategy_overlay_analysis_independent.json
      - name: Upload strict research reports
        uses: actions/upload-artifact@v4
        with:
          name: mlb-pca-astar-backtest
          path: |
            sports/mlb/research/pca_edge_search/reports/historical_universe_backtest_independent.json
            sports/mlb/research/pca_edge_search/reports/historical_universe_scored_rows_independent.csv
            sports/mlb/research/pca_edge_search/reports/strategy_overlay_analysis_independent.json

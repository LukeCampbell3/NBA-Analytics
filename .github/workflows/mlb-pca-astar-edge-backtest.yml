name: MLB PCA A* Edge Backtest

on:
  push:
    branches: [mlb-pca-astar-edge-search]
    paths:
      - 'sports/mlb/research/pca_edge_search/**'
      - '.github/workflows/mlb-pca-astar-edge-backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run locked model-free PCA + A* broad-universe backtest
        run: |
          mkdir -p pca_astar_backtest_output
          python sports/mlb/research/pca_edge_search/backtest_historical_universe_model_free.py \
            --input sports/mlb/data/predictions/calibration/historical_pool_universe_2026.csv \
            --output-json pca_astar_backtest_output/broad_model_free_summary.json \
            --output-csv pca_astar_backtest_output/broad_model_free_scored_rows.csv
      - name: Print summary
        run: cat pca_astar_backtest_output/broad_model_free_summary.json
      - name: Persist auditable research summary
        run: |
          mkdir -p sports/mlb/data/evaluation/pca_astar_edge
          cp pca_astar_backtest_output/broad_model_free_summary.json \
             sports/mlb/data/evaluation/pca_astar_edge/broad_model_free_summary.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sports/mlb/data/evaluation/pca_astar_edge/broad_model_free_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: record broad model-free PCA A* backtest [skip ci]'
            git push
          fi
      - name: Upload backtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-pca-astar-edge-backtest
          path: pca_astar_backtest_output/
          if-no-files-found: warn

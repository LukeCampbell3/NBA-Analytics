name: MLB PCA A* Edge Backtest

on:
  push:
    branches: [mlb-pca-astar-edge-search]
    paths:
      - 'sports/mlb/research/pca_edge_search/**'
      - '.github/workflows/mlb-pca-astar-edge-backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run locked model-free PCA + A* broad-universe backtest
        env:
          PYTHONPATH: .
        run: |
          mkdir -p pca_astar_backtest_output
          python - <<'PY'
          from pathlib import Path
          import sports.mlb.research.pca_edge_search.backtest_historical_universe_model_free as m

          # The helper SearchConfig predates bootstrap seeding.  A class-level
          # default keeps the frozen dataclass unchanged while making this
          # research run deterministic.
          m.SearchConfig.seed = 20260916
          m.run(
              Path('sports/mlb/data/predictions/calibration/historical_pool_universe_2026.csv'),
              Path('pca_astar_backtest_output/broad_model_free_summary.json'),
              Path('pca_astar_backtest_output/broad_model_free_scored_rows.csv'),
          )
          PY
      - name: Print summary
        run: cat pca_astar_backtest_output/broad_model_free_summary.json
      - name: Persist auditable research summary
        run: |
          mkdir -p sports/mlb/data/evaluation/pca_astar_edge
          cp pca_astar_backtest_output/broad_model_free_summary.json \
             sports/mlb/data/evaluation/pca_astar_edge/broad_model_free_summary.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sports/mlb/data/evaluation/pca_astar_edge/broad_model_free_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: record broad model-free PCA A* backtest [skip ci]'
            git push
          fi
      - name: Upload backtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-pca-astar-edge-backtest
          path: pca_astar_backtest_output/
          if-no-files-found: warn

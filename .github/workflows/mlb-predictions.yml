name: MLB Predictions and Frontend

# Compatibility entry point only. Production scheduling and execution belong to
# MLB Publication Controller -> MLB Authoritative Publication Worker.
# Keeping this workflow_dispatch shim preserves old manual links without giving
# the legacy workflow any independent cron or push publication authority.
on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Optional Eastern run date (YYYY-MM-DD); defaults to today"
        required: false
        type: string
      build_only:
        description: "Deprecated compatibility input; authoritative worker always validates the full publication"
        required: false
        default: false
        type: boolean
      publication_mode:
        description: "Publication authority"
        required: true
        default: "PUBLISH"
        type: choice
        options:
          - PUBLISH
          - REFRESH
          - LATE_ADD

permissions:
  actions: write
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  TZ: America/New_York

jobs:
  forward-to-authoritative-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Forward request
        env:
          INPUT_RUN_DATE: ${{ inputs.run_date }}
          INPUT_MODE: ${{ inputs.publication_mode }}
        run: |
          set -euo pipefail
          run_date="${INPUT_RUN_DATE:-$(date +%F)}"
          python -c "from datetime import date; date.fromisoformat('$run_date')"
          mode="${INPUT_MODE:-PUBLISH}"
          case "$mode" in
            PUBLISH|REFRESH|LATE_ADD) ;;
            *) echo "Unsupported publication mode: $mode" >&2; exit 2 ;;
          esac
          gh workflow run mlb-publication-worker.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref static-deployment \
            -f run_date="$run_date" \
            -f publication_mode="$mode"
          echo "Forwarded MLB $mode $run_date to authoritative worker."

name: MLB Predictions and Frontend

on:
  push:
    branches: [static-deployment]
    paths:
      - 'sports/mlb/scripts/balanced_market_ensemble_v4.py'
      - 'sports/mlb/scripts/enrich_parlay_leg_betslip.py'
      - 'sports/mlb/scripts/export_web_prediction_payload.py'
      - 'sports/mlb/scripts/select_high_hit_parlay.py'
      - 'sports/mlb/scripts/build_exotic_market_shadow.py'
      - 'sports/mlb/scripts/validate_v4_live_players.py'
      - 'sports/mlb/scripts/run_pinned_v2_1_daily_shadow.py'
      - 'sports/mlb/scripts/preserve_published_predictions.py'
      - 'sports/mlb/scripts/settle_published_predictions.py'
      - 'sports/mlb/parlay_v2/pitcher_alt_line_frontier.py'
      - 'sports/mlb/tests/test_build_exotic_market_shadow.py'
      - 'sports/mlb/tests/test_validate_v4_live_players.py'
      - 'sports/mlb/tests/test_preserve_published_predictions.py'
      - 'sports/mlb/tests/test_settle_published_predictions.py'
      - 'sports/mlb/tests/test_pitcher_parlay_reliability.py'
      - 'sports/mlb/web/predictions.js'
      - 'sports/mlb/web/predictions.html'
      - 'sports/mlb/web/data/history/**'
      - 'sports/mlb/unified/**'
      - 'sports/mlb/scripts/run_unified_mlb_shadow.py'
      - 'sports/site/pipeline/run_daily_predictions.py'
      - '.github/workflows/mlb-predictions.yml'
  schedule:
    - cron: "17 8 * 3-10 *"
      timezone: "America/New_York"
    - cron: "30 18 * 3-10 *"
      timezone: "America/New_York"
    - cron: "30 23 * 3-10 *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Optional Eastern run date (YYYY-MM-DD)"
        required: false
        type: string
      build_only:
        description: "Rebuild and validate the existing MLB publication"
        required: false
        default: false
        type: boolean

concurrency:
  group: mlb-production-static-deployment
  cancel-in-progress: false

permissions:
  contents: write

env:
  PUBLISH_BRANCH: static-deployment
  PYTHONUNBUFFERED: "1"
  TZ: America/New_York
  MLB_ODDS_PROVIDER_PRIORITY: ${{ vars.MLB_ODDS_PROVIDER_PRIORITY || 'fanduel_public,the_odds_api,scrape,existing_provider,fresh_cache' }}
  MLB_ODDS_MAX_AGE_SECONDS: ${{ vars.MLB_ODDS_MAX_AGE_SECONDS || '3600' }}
  MLB_ODDS_SCRAPE_ENABLED: ${{ vars.MLB_ODDS_SCRAPE_ENABLED || '0' }}
  MLB_ODDS_SCRAPE_AUTHORIZED: ${{ vars.MLB_ODDS_SCRAPE_AUTHORIZED || '0' }}
  MLB_ODDS_SCRAPE_SOURCE: ${{ vars.MLB_ODDS_SCRAPE_SOURCE }}
  THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
  MLB_FANDUEL_REGION: ${{ vars.MLB_FANDUEL_REGION || 'NJ' }}
  MLB_FANDUEL_RATE_LIMIT_RPS: ${{ vars.MLB_FANDUEL_RATE_LIMIT_RPS || '2' }}

jobs:
  mlb-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout prediction frontend branch
        uses: actions/checkout@v7
        with:
          ref: static-deployment
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sports/mlb/requirements-same-game.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r sports/mlb/requirements-same-game.txt

      - name: Resolve MLB run configuration
        id: run-config
        env:
          INPUT_RUN_DATE: ${{ inputs.run_date }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_RUN_DATE" ]]; then
            run_date="$INPUT_RUN_DATE"
          elif [[ "$(date +%H)" -ge 23 ]]; then
            # The overnight publication prepares the next Eastern slate.
            run_date="$(date -d tomorrow +%F)"
          else
            run_date="$(date +%F)"
          fi
          RUN_DATE_CANDIDATE="$run_date" python -c \
            'import os; from datetime import date; date.fromisoformat(os.environ["RUN_DATE_CANDIDATE"])'
          weekday="$(date -d "$run_date" +%u)"
          refresh_history=false
          if [[ "$weekday" == "1" ]]; then
            refresh_history=true
          fi
          echo "run_date=$run_date" >> "$GITHUB_OUTPUT"
          echo "run_stamp=${run_date//-/}" >> "$GITHUB_OUTPUT"
          echo "refresh_history=$refresh_history" >> "$GITHUB_OUTPUT"
          {
            echo "### MLB prediction run"
            echo "- Date: $run_date (America/New_York)"
            echo "- Weekly history refresh: $refresh_history"
            echo "- V2.1 challenger commit: 55b7d07c1e4b58b362cf5f7afccdbf81ee76d9f0"
            echo "- V2.1 authority: prospective shadow only"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore incremental MLB state
        if: inputs.build_only != true
        uses: actions/cache@v5
        with:
          path: |
            Player-Predictor/Data-Proc-MLB
            sports/mlb/data/predictions/daily_runs
            sports/mlb/data/predictions/calibration/*.json
          key: mlb-daily-v4-${{ runner.os }}-${{ hashFiles('Player-Predictor/scripts/update_mlb_processed_data.py', 'sports/mlb/decision_engine/matchup_network.py', 'sports/mlb/scripts/backtest_latent_daily_pools.py') }}-${{ steps.run-config.outputs.run_stamp }}-${{ github.run_id }}
          restore-keys: |
            mlb-daily-v4-${{ runner.os }}-${{ hashFiles('Player-Predictor/scripts/update_mlb_processed_data.py', 'sports/mlb/decision_engine/matchup_network.py', 'sports/mlb/scripts/backtest_latent_daily_pools.py') }}-${{ steps.run-config.outputs.run_stamp }}-
            mlb-daily-v4-${{ runner.os }}-${{ hashFiles('Player-Predictor/scripts/update_mlb_processed_data.py', 'sports/mlb/decision_engine/matchup_network.py', 'sports/mlb/scripts/backtest_latent_daily_pools.py') }}-

      - name: Preserve and validate prior published MLB picks
        if: inputs.build_only != true
        run: |
          set -euo pipefail
          python -m pytest \
            sports/mlb/tests/test_preserve_published_predictions.py \
            sports/mlb/tests/test_settle_published_predictions.py \
            -q
          python sports/mlb/scripts/preserve_published_predictions.py
          python sports/mlb/scripts/settle_published_predictions.py

      - name: Run MLB production pipeline
        env:
          RUN_DATE: ${{ steps.run-config.outputs.run_date }}
          REFRESH_HISTORY: ${{ steps.run-config.outputs.refresh_history }}
          BUILD_ONLY: ${{ inputs.build_only || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_ONLY" == "true" ]]; then
            python sports/site/pipeline/build_static_site.py
            exit 0
          fi

          # Generate all existing MLB products from the same resolved slate date.
          # These remain the legacy-authoritative publication path.
          bash sports/mlb/scripts/validate_same_game_pipeline.sh test
          bash sports/mlb/scripts/validate_pitcher_parlay_pipeline.sh test
          python -m pytest \
            sports/mlb/tests/test_build_exotic_market_shadow.py \
            sports/mlb/tests/test_validate_v4_live_players.py \
            tests/test_run_daily_predictions.py \
            -q
          bash sports/mlb/scripts/validate_same_game_pipeline.sh pipeline --run-date "$RUN_DATE"
          bash sports/mlb/scripts/validate_pitcher_parlay_pipeline.sh pipeline --run-date "$RUN_DATE"
          python sports/mlb/scripts/build_exotic_market_shadow.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path("sports/mlb/web/data/exotic_market_predictions.json").read_text())
          assert payload["policy"] == "EXOTIC_MARKETS_V1_SHADOW"
          assert payload["run_date"] == os.environ["RUN_DATE"]
          assert payload["publication_authority"] is False
          assert isinstance(payload["candidates"], list)
          assert all(float(row["expected_value_per_unit"]) > 0 for row in payload["candidates"])
          keys = [(row.get("game_id"), row.get("market"), row.get("line")) for row in payload["candidates"]]
          assert len(keys) == len(set(keys)), "duplicate game-market-line exotic candidates"
          assert isinstance(payload["market_registry"], list) and payload["market_registry"]
          PY

          args=(
            --run-date "$RUN_DATE"
            --skip-nba
            --mlb-market-provider provider_chain
            --mlb-fallback-policy exact_only
            --mlb-incremental-update
          )
          if [[ "$REFRESH_HISTORY" == "true" ]]; then
            args+=(--mlb-refresh-history-caches)
          fi
          python run_daily_predictions.py "${args[@]}"
          # Publication-only negative authority: immutable V4 evidence remains
          # untouched, while wrong-game, nonstarter, and unlinked players are
          # removed from the live board and accepted rows gain team/opponent IDs.
          python sports/mlb/scripts/validate_v4_live_players.py

      - name: Run frozen V2.1 daily shadow pool
        if: inputs.build_only != true
        env:
          RUN_DATE: ${{ steps.run-config.outputs.run_date }}
        run: |
          set -euo pipefail
          python sports/mlb/scripts/run_pinned_v2_1_daily_shadow.py --run-date "$RUN_DATE"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("sports/mlb/web/data/daily_predictions.json").read_text())
          shadow = payload.get("v2_1_shadow")
          assert isinstance(shadow, dict), "V2.1 shadow payload missing"
          assert shadow["run_date"] == os.environ["RUN_DATE"]
          assert shadow["policy"] == "UNIFIED_MLB_V2_1"
          assert shadow["policy_hash"] == "80f335d2501d54502909d7f8587ebfef56d725a67d44ae125f9df4337d489b1c"
          assert shadow["baseline_policy_hash"] == "52deb038a076b39a1bc840b77ae26648d9e4ffa20194135e7d48b9761edbc611"
          assert shadow["implementation_commit"] == "55b7d07c1e4b58b362cf5f7afccdbf81ee76d9f0"
          assert shadow["production_authorized"] is False
          v4 = payload.get("v4_singles_shadow") or {}
          for play in v4.get("plays") or []:
              assert play.get("identity_status") == "VALIDATED"
              assert play.get("lineup_status") == "CONFIRMED_STARTER"
              assert play.get("execution_status") == "LIVE_SELECTION_AVAILABLE"
              assert play.get("team") and play.get("opponent") and play.get("player_id")
          PY
          node --check sports/mlb/web/predictions.js

          # Unified migration remains shadow-only. It consumes the completed
          # legacy artifacts, cannot authorize publication/staking, and writes
          # one coherent artifact for side-by-side validation.
          python sports/mlb/scripts/run_unified_mlb_shadow.py --run-date "$RUN_DATE"
          # The pinned runner above already executed V2.1 at its immutable
          # implementation commit and appended the all-candidate evidence.
          # Audit that evidence without allowing a shadow-data deficiency to
          # suppress the legacy-authoritative board.
          python sports/mlb/scripts/audit_daily_mlb_slate.py --run-date "$RUN_DATE"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          source = Path("sports/mlb/web/data/unified_predictions.json")
          payload = json.loads(source.read_text())
          assert payload["run_date"] == os.environ["RUN_DATE"]
          assert payload["evidence"]["publication_authority"] is False
          for target in (Path("dist/mlb/data/unified_predictions.json"), Path("paywall/private-content/app/mlb/data/unified_predictions.json")):
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          manifest = Path("sports/mlb/web/data/mlb_engine_manifest.json")
          for target in (Path("dist/mlb/data/mlb_engine_manifest.json"), Path("paywall/private-content/app/mlb/data/mlb_engine_manifest.json")):
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(manifest, target)
          PY

      - name: Validate MLB publication
        env:
          RUN_DATE: ${{ steps.run-config.outputs.run_date }}
          BUILD_ONLY: ${{ inputs.build_only || 'false' }}
        run: |
          set -euo pipefail
          args=(--run-date "$RUN_DATE" --sports mlb)
          if [[ "$BUILD_ONLY" == "true" ]]; then
            args+=(--allow-stale-payloads)
          fi
          python sports/site/pipeline/validate_daily_publication.py "${args[@]}"

      - name: Preserve current MLB publication
        if: inputs.build_only != true
        run: |
          set -euo pipefail
          python sports/mlb/scripts/preserve_published_predictions.py
          python - <<'PY'
          import shutil
          from pathlib import Path
          source = Path("sports/mlb/web/data/history")
          for target in (Path("dist/mlb/data/history"), Path("paywall/private-content/app/mlb/data/history")):
              shutil.copytree(source, target, dirs_exist_ok=True)
          PY

      - name: Stage MLB publication and feedback state
        id: staged
        run: |
          set -euo pipefail
          git add -f -- \
            sports/mlb/web/data/daily_predictions.json \
            sports/mlb/web/data/same_game_predictions.json \
            sports/mlb/web/data/pitcher_parlay_predictions.json \
            sports/mlb/web/data/exotic_market_predictions.json \
            sports/mlb/web/data/unified_predictions.json \
            sports/mlb/web/data/mlb_engine_manifest.json \
            sports/mlb/data/predictions/unified/evidence.jsonl \
            sports/mlb/data/predictions/unified/v2_1_evidence.jsonl \
            artifacts/mlb_v2_daily_evidence.json \
            artifacts/mlb_v2_challenger_status.json \
            artifacts/mlb_slate_integrity_audit.json \
            docs/mlb_v2_daily_evidence.md \
            docs/mlb_v2_selector_efficiency_report.md \
            docs/mlb_v2_challenger_report.md \
            docs/mlb_v2_high_efficiency_selection_report.md \
            docs/mlb_slate_integrity_audit.md \
            sports/mlb/web/data/history/index.json \
            sports/mlb/web/data/history/*.json \
            sports/mlb/web/data/history/runs \
            sports/mlb/web/data/history/products \
            sports/mlb/data/predictions/settlement/mlb_settlement_report.json \
            dist/mlb \
            paywall/private-content/app/mlb

          if [ -e sports/mlb/web/data/headshots ]; then
            git add -f -- sports/mlb/web/data/headshots
          fi

          for optional_path in \
            sports/mlb/parlay_v2/calibration/reports/calibration_ledger.jsonl \
            sports/mlb/parlay_v2/calibration/reports/pair_observation_ledger.jsonl \
            sports/mlb/parlay_v2/calibration/reports/same_game_calibration_ledger.jsonl \
            sports/mlb/parlay_v2/calibration/reports/same_game_pair_observations.jsonl \
            sports/mlb/parlay_v2/calibration/reports/pitcher_parlay_calibration_ledger.jsonl \
            sports/mlb/parlay_v2/reports \
            sports/mlb/research/parlay_certification_v2/reports \
            sports/mlb/data/raw/market_odds/mlb/odds_api_io/latest_player_props_long.csv \
            sports/mlb/data/raw/market_odds/mlb/odds_api_io/latest_player_props_long.parquet \
            sports/mlb/data/raw/market_odds/mlb/odds_api_io/latest_player_props_wide.csv \
            sports/mlb/data/raw/market_odds/mlb/odds_api_io/latest_player_props_wide.parquet \
            sports/mlb/data/raw/market_odds/mlb/odds_api_io/history_player_props_long.csv \
            sports/mlb/data/raw/market_odds/mlb/odds_api_io/history_player_props_long.parquet \
            sports/mlb/data/raw/market_odds/mlb/odds_api_io/history_player_props_wide.csv \
            sports/mlb/data/raw/market_odds/mlb/odds_api_io/history_player_props_wide.parquet \
            sports/mlb/data/raw/market_odds/mlb/odds_api_io/latest_manifest.json \
            sports/mlb/data/predictions/balanced_ranking_v3_prospective \
            sports/mlb/data/predictions/unified/v2_1_evidence.jsonl
          do
            if [ -e "$optional_path" ]; then
              git add -f -- "$optional_path"
            fi
          done

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Commit and push MLB publication
        if: steps.staged.outputs.has_changes == 'true'
        env:
          RUN_DATE: ${{ steps.run-config.outputs.run_date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "MLB predictions $RUN_DATE [skip ci]"
          if ! git push origin "HEAD:$PUBLISH_BRANCH"; then
            git pull --rebase --autostash origin "$PUBLISH_BRANCH"
            git push origin "HEAD:$PUBLISH_BRANCH"
          fi

      - name: Upload MLB frontend payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlb-frontend-${{ steps.run-config.outputs.run_stamp || github.run_id }}
          path: |
            dist/mlb/data/daily_predictions.json
            dist/mlb/data/same_game_predictions.json
            dist/mlb/data/pitcher_parlay_predictions.json
            dist/mlb/data/exotic_market_predictions.json
            dist/mlb/data/unified_predictions.json
            dist/mlb/data/mlb_engine_manifest.json
            sports/mlb/web/data/daily_predictions.json
            sports/mlb/web/data/same_game_predictions.json
            sports/mlb/web/data/pitcher_parlay_predictions.json
            sports/mlb/web/data/exotic_market_predictions.json
            sports/mlb/data/predictions/unified/v2_1_evidence.jsonl
            sports/mlb/web/data/unified_predictions.json
            sports/mlb/web/data/mlb_engine_manifest.json
            sports/mlb/data/predictions/backtests/latent_daily_pool_replay_2026.json
            sports/mlb/data/predictions/team_market_predictions.json
          if-no-files-found: warn
          retention-days: 14

  # Shadow-only research job: measures whether MLB's pregame prop-line path
  # carries incremental evidence beyond the pool's existing day-of score.
  # It never affects publication and failure is deliberately non-blocking.
  mlb-path-evidence-shadow:
    needs: mlb-predictions
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout prediction frontend branch
        uses: actions/checkout@v7
        with:
          ref: static-deployment
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build MLB path-conditioned reservoir from settled history
        run: |
          set -euo pipefail
          mkdir -p /tmp/mlb_path_evidence_shadow
          python -m sports.mlb.conditional_chain.build_reservoir_from_history \
            --out-csv /tmp/mlb_path_evidence_shadow/reservoir.csv \
            --out-summary-json /tmp/mlb_path_evidence_shadow/reservoir_summary.json

      - name: Build MLB path features from recovered market snapshots
        run: |
          set -euo pipefail
          python -m sports.mlb.conditional_chain.build_path_features_from_market_snapshots \
            --reservoir-csv /tmp/mlb_path_evidence_shadow/reservoir.csv \
            --out-csv /tmp/mlb_path_evidence_shadow/path_features.csv

      - name: Run MLB path-conditioned shadow replay
        run: |
          set -euo pipefail
          cat > /tmp/mlb_path_evidence_shadow/path_certificate.json <<'JSON'
          {"status": "INSUFFICIENT_REAL_PATH_EVENTS", "path_authorized": false}
          JSON
          python -m sports.mlb.conditional_chain.path_conditioned_cli \
            --reservoir /tmp/mlb_path_evidence_shadow/reservoir.csv \
            --path-features /tmp/mlb_path_evidence_shadow/path_features.csv \
            --path-certificate /tmp/mlb_path_evidence_shadow/path_certificate.json \
            --output-dir /tmp/mlb_path_evidence_shadow/report \
            --block-label mlb_path_evidence_shadow

      - name: Upload MLB path-evidence shadow report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlb-path-evidence-shadow-${{ github.run_id }}
          path: /tmp/mlb_path_evidence_shadow
          if-no-files-found: warn
          retention-days: 14

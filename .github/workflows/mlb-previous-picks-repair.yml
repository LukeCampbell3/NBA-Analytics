name: MLB Previous Picks Repair

on:
  push:
    branches: [static-deployment]
    paths:
      - '.github/workflows/mlb-previous-picks-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout static deployment
        uses: actions/checkout@v7
        with:
          ref: static-deployment
          fetch-depth: 0

      - name: Run repair
        run: python sports/mlb/scripts/repair_previous_picks_frontend.py

      - name: Test repair
        run: |
          python -m pip install pytest
          python -m pytest sports/mlb/tests/test_preserve_published_predictions.py -q
          node --check sports/mlb/web/predictions-roi-overrides.js
          python sports/mlb/scripts/repair_previous_picks_frontend.py

      - name: Commit repaired frontend
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- \
            sports/mlb/web/predictions-roi-overrides.js \
            sports/mlb/web/predictions.html \
            sports/mlb/scripts/preserve_published_predictions.py \
            sports/mlb/tests/test_preserve_published_predictions.py \
            sports/mlb/web/data/history/index.json \
            dist/mlb/predictions-roi-overrides.js \
            dist/mlb/predictions.html \
            dist/mlb/data/history/index.json \
            paywall/private-content/app/mlb/predictions-roi-overrides.js \
            paywall/private-content/app/mlb/predictions.html \
            paywall/private-content/app/mlb/data/history/index.json
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'MLB: show September 5 as previous published slate [skip ci]'
          git push origin HEAD:static-deployment

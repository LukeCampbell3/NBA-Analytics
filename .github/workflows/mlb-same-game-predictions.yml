name: MLB Same-Game Combo Predictions

on:
  schedule:
    # Daily during the real MLB regular season window (Mar-Oct), same
    # season bound as mlb-predictions.yml -- offset by 20 minutes and its
    # own concurrency group so this brand-new, additive pipeline never
    # blocks or is blocked by the existing live single-leg board's run.
    - cron: "37 8 * 3-10 *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      build_only:
        description: "Run tests and rebuild the site from the existing publication without a live fetch"
        required: false
        default: false
        type: boolean

concurrency:
  group: mlb-same-game-predictions-static-deployment
  cancel-in-progress: false

permissions:
  contents: write

env:
  PUBLISH_BRANCH: static-deployment
  PYTHONUNBUFFERED: "1"
  TZ: America/New_York
  THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}

jobs:
  mlb-same-game-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout prediction frontend branch
        uses: actions/checkout@v7
        with:
          ref: static-deployment
          # Shallow on purpose: this was the real cost driver (a
          # fetch-depth: 0 checkout on this repo pulls full history
          # across every branch -- 9 branches, 15,884 files -- costing
          # ~14 real minutes in earlier runs, dwarfing the actual pip
          # install + test + pipeline + build work below, which finishes
          # in well under a minute). Nothing in this workflow reads git
          # history (no log/blame/rev-list) -- it only needs the current
          # tree to build from and a linear base to push one new commit
          # onto, which a shallow clone supports fine.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sports/mlb/requirements-same-game.txt

      # Every step below calls validate_same_game_pipeline.sh -- the same
      # script a developer runs locally (see that file's header) before
      # ever pushing. This is the single source of truth for these
      # commands: CI and local iteration can never drift apart, and
      # `bash sports/mlb/scripts/validate_same_game_pipeline.sh fast`
      # reproduces the install+test steps below in a couple of seconds
      # on a warm pip cache, so a real CI round-trip is only ever needed
      # to confirm, never to debug.
      - name: Install dependencies
        run: bash sports/mlb/scripts/validate_same_game_pipeline.sh install

      - name: Run MLB same-game combo tests
        run: bash sports/mlb/scripts/validate_same_game_pipeline.sh test

      - name: Run MLB same-game daily combo pipeline
        if: ${{ !inputs.build_only }}
        run: bash sports/mlb/scripts/validate_same_game_pipeline.sh pipeline

      - name: Build static site
        run: bash sports/mlb/scripts/validate_same_game_pipeline.sh build

      - name: Stage MLB same-game publication
        id: staged
        run: |
          set -euo pipefail
          git add -f -- \
            sports/mlb/web/data/same_game_predictions.json \
            dist/mlb/data/same_game_predictions.json \
            dist/data/sports.json \
            paywall/private-content/app/mlb/data/same_game_predictions.json
          # Both calibration ledgers are lazily created (only once a real
          # candidate/observation is first admitted) -- same guard every
          # other sport's workflow uses for its own lazily-created
          # PARLAY_V2 paths.
          if [ -e sports/mlb/parlay_v2/calibration/reports/same_game_calibration_ledger.jsonl ]; then
            git add -f -- sports/mlb/parlay_v2/calibration/reports/same_game_calibration_ledger.jsonl
          fi
          if [ -e sports/mlb/parlay_v2/calibration/reports/same_game_pair_observations.jsonl ]; then
            git add -f -- sports/mlb/parlay_v2/calibration/reports/same_game_pair_observations.jsonl
          fi
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Commit and push MLB same-game publication
        if: steps.staged.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "MLB same-game combo predictions $(date -u +%F) [skip ci]"
          if ! git push origin "HEAD:$PUBLISH_BRANCH"; then
            git pull --rebase --autostash origin "$PUBLISH_BRANCH"
            git push origin "HEAD:$PUBLISH_BRANCH"
          fi

      - name: Upload MLB same-game publication diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlb-same-game-predictions-${{ github.run_id }}
          path: |
            sports/mlb/web/data/same_game_predictions.json
            dist/mlb/data/same_game_predictions.json
          if-no-files-found: warn
          retention-days: 14

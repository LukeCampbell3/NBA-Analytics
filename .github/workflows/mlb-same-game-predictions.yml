name: MLB Same-Game Combo Predictions

on:
  schedule:
    # Daily during the real MLB regular season window (Mar-Oct), same
    # season bound as mlb-predictions.yml -- offset by 20 minutes and its
    # own concurrency group so this brand-new, additive pipeline never
    # blocks or is blocked by the existing live single-leg board's run.
    - cron: "37 8 * 3-10 *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      build_only:
        description: "Run tests and rebuild the site from the existing publication without a live fetch"
        required: false
        default: false
        type: boolean

concurrency:
  group: mlb-same-game-predictions-static-deployment
  cancel-in-progress: false

permissions:
  contents: write

env:
  PUBLISH_BRANCH: static-deployment
  PYTHONUNBUFFERED: "1"
  TZ: America/New_York
  THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}

jobs:
  mlb-same-game-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout prediction frontend branch
        uses: actions/checkout@v7
        with:
          ref: static-deployment
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sports/mlb/requirements-same-game.txt

      - name: Install dependencies
        run: |
          # This same-game pipeline's own real imports are only requests/
          # numpy/pandas (+pytest for tests) -- verified by grepping every
          # module this workflow actually touches. Root requirements.txt
          # (shared by the MLB/NBA player-prop workflows) drags in
          # tensorflow/catboost/xgboost/scikit-learn/h5py/matplotlib/
          # nba_api, none of which this pipeline uses; installing all of
          # that was the real bulk of this workflow's runtime. Scoped
          # requirements file here, same pattern PGA golf's own
          # requirements.txt already established for the same reason.
          python -m pip install -r sports/mlb/requirements-same-game.txt

      - name: Run MLB same-game combo tests
        run: |
          python -m pytest \
            sports/mlb/tests/test_fetch_mlb_pitcher_game_data.py \
            sports/mlb/tests/test_pitcher_bullpen_model.py \
            sports/mlb/tests/test_pitching_enriched_win_model.py \
            sports/mlb/tests/test_game_simulation_model.py \
            sports/mlb/tests/test_select_mlb_same_game_bets.py \
            sports/mlb/tests/test_run_mlb_same_game_daily.py \
            sports/mlb/tests/test_the_odds_api_mlb_team_market_provider.py \
            sports/mlb/tests/test_backtest_pitching_enriched_win_model.py \
            sports/mlb/tests/test_backtest_game_simulation_model.py \
            -q

      - name: Run MLB same-game daily combo pipeline
        if: ${{ !inputs.build_only }}
        run: |
          set -euo pipefail
          python sports/mlb/scripts/run_mlb_same_game_daily.py

      - name: Build static site
        run: python sports/site/pipeline/build_static_site.py

      - name: Stage MLB same-game publication
        id: staged
        run: |
          set -euo pipefail
          git add -f -- \
            sports/mlb/web/data/same_game_predictions.json \
            dist/mlb/data/same_game_predictions.json \
            dist/data/sports.json \
            paywall/private-content/app/mlb/data/same_game_predictions.json
          # Both calibration ledgers are lazily created (only once a real
          # candidate/observation is first admitted) -- same guard every
          # other sport's workflow uses for its own lazily-created
          # PARLAY_V2 paths.
          if [ -e sports/mlb/parlay_v2/calibration/reports/same_game_calibration_ledger.jsonl ]; then
            git add -f -- sports/mlb/parlay_v2/calibration/reports/same_game_calibration_ledger.jsonl
          fi
          if [ -e sports/mlb/parlay_v2/calibration/reports/same_game_pair_observations.jsonl ]; then
            git add -f -- sports/mlb/parlay_v2/calibration/reports/same_game_pair_observations.jsonl
          fi
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Commit and push MLB same-game publication
        if: steps.staged.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "MLB same-game combo predictions $(date -u +%F) [skip ci]"
          if ! git push origin "HEAD:$PUBLISH_BRANCH"; then
            git pull --rebase --autostash origin "$PUBLISH_BRANCH"
            git push origin "HEAD:$PUBLISH_BRANCH"
          fi

      - name: Upload MLB same-game publication diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlb-same-game-predictions-${{ github.run_id }}
          path: |
            sports/mlb/web/data/same_game_predictions.json
            dist/mlb/data/same_game_predictions.json
          if-no-files-found: warn
          retention-days: 14

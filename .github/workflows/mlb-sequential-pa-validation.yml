name: MLB Sequential PA Validation

on:
  push:
    branches: [static-deployment]
    paths:
      - '.github/workflows/mlb-sequential-pa-validation.yml'
      - 'sports/mlb/advanced/**'
      - 'sports/mlb/scripts/backtest_sequential_pa_hitter_model.py'
      - 'sports/mlb/tests/test_advanced_mlb_profiles.py'
      - 'sports/mlb/tests/test_advanced_source_refresh.py'
      - 'sports/mlb/tests/test_sequential_pa_model.py'
      - 'sports/mlb/tests/test_sequential_pa_identity_hydration.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-sequential-pa-validation-static-deployment
  cancel-in-progress: false

jobs:
  validate-sequential-pa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout static deployment
        uses: actions/checkout@v7
        with:
          ref: static-deployment
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sports/mlb/requirements-same-game.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r sports/mlb/requirements-same-game.txt pytest

      - name: Run sequential PA invariants
        run: |
          set -euo pipefail
          python -m pytest \
            sports/mlb/tests/test_advanced_mlb_profiles.py \
            sports/mlb/tests/test_advanced_source_refresh.py \
            sports/mlb/tests/test_sequential_pa_model.py \
            sports/mlb/tests/test_sequential_pa_identity_hydration.py \
            -q

      - name: Run leakage-safe rolling-origin validation
        run: |
          set -euo pipefail
          python sports/mlb/scripts/backtest_sequential_pa_hitter_model.py \
            --season 2026 \
            --max-rows 240 \
            --trials 5000 \
            --min-history 20 \
            --out-json artifacts/mlb_sequential_pa_historical_validation.json \
            --out-md artifacts/mlb_sequential_pa_historical_validation.md

      - name: Validate historical report contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/mlb_sequential_pa_historical_validation.json').read_text())
          assert p['schema_version'] == 'mlb_sequential_pa_historical_validation_v1'
          assert p['evidence_class'] == 'ROLLING_ORIGIN_HIGH_FIDELITY_DIAGNOSTIC_NOT_CERTIFICATION'
          assert p['economic_evidence']['roi_claim'] is False
          assert p['rows'] > 0, 'historical validation produced no evaluable rows'
          for target in ('H', 'TB'):
              item = p['summary'][target]
              assert item['rows'] > 0
              for model in ('legacy', 'sequential_raw', 'sequential_usable'):
                  if model == 'sequential_usable':
                      keys = ('brier', 'log_loss', 'ece')
                  else:
                      keys = ('brier', 'log_loss', 'ece')
                  for key in keys:
                      value = item[model][key]
                      assert value is None or float(value) >= 0
          print(json.dumps(p['summary'], indent=2))
          PY

      - name: Commit validation evidence
        run: |
          set -euo pipefail
          git add -f -- \
            artifacts/mlb_sequential_pa_historical_validation.json \
            artifacts/mlb_sequential_pa_historical_validation.md
          if git diff --cached --quiet; then
            echo 'No validation evidence change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'MLB sequential PA rolling-origin validation [skip ci]'
          if ! git push origin HEAD:static-deployment; then
            git pull --rebase --autostash origin static-deployment
            git push origin HEAD:static-deployment
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlb-sequential-pa-validation-${{ github.run_id }}
          path: |
            artifacts/mlb_sequential_pa_historical_validation.json
            artifacts/mlb_sequential_pa_historical_validation.md
          if-no-files-found: error
          retention-days: 30

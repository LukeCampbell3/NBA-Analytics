name: MLB Settle Predictions

on:
  schedule:
    # 3am America/New_York -- strictly before mlb-predictions.yml's 8:17am
    # run, so the previous day's real games are already final (they end
    # the night before) but archive_previous_prediction_payload() hasn't
    # yet copied daily_predictions.json into history/<date>.json for that
    # day. Settling daily_predictions.json here, before that copy happens,
    # is what makes the settled result show up automatically in the
    # archived history file too -- see settle_published_predictions.py's
    # own module docstring.
    - cron: "0 3 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      only_date:
        description: "Optional single history date to settle (YYYY-MM-DD). Leave blank to settle every date still missing settlement (this is also what the first-ever run does automatically -- a real catch-up over the whole archive)."
        required: false
        type: string

concurrency:
  group: mlb-production-static-deployment
  cancel-in-progress: false

permissions:
  contents: write

env:
  PUBLISH_BRANCH: static-deployment
  PYTHONUNBUFFERED: "1"
  TZ: America/New_York

jobs:
  mlb-settle-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout prediction frontend branch
        uses: actions/checkout@v7
        with:
          ref: static-deployment
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Settle published MLB predictions against real MLB results
        env:
          ONLY_DATE: ${{ inputs.only_date }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${ONLY_DATE:-}" ]]; then
            args+=(--only-date "$ONLY_DATE")
          fi
          python sports/mlb/scripts/settle_published_predictions.py "${args[@]}"

      - name: Rebuild static site with settled results
        run: |
          set -euo pipefail
          python sports/site/pipeline/build_static_site.py

      - name: Stage settled MLB publication
        id: staged
        run: |
          set -euo pipefail
          git add -f -- \
            sports/mlb/web/data/daily_predictions.json \
            sports/mlb/web/data/history/*.json \
            sports/mlb/web/data/same_game_predictions.json \
            sports/mlb/web/data/pitcher_parlay_predictions.json \
            sports/mlb/data/predictions/settlement/mlb_settlement_report.json \
            dist/mlb \
            paywall/private-content/app/mlb
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Commit and push settled MLB publication
        if: steps.staged.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "MLB settlement $(date +%F) [skip ci]"
          if ! git push origin "HEAD:$PUBLISH_BRANCH"; then
            git pull --rebase --autostash origin "$PUBLISH_BRANCH"
            git push origin "HEAD:$PUBLISH_BRANCH"
          fi

      - name: Upload MLB settlement report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlb-settlement-${{ github.run_id }}
          path: sports/mlb/data/predictions/settlement/mlb_settlement_report.json
          if-no-files-found: warn
          retention-days: 14

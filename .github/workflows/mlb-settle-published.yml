name: MLB Settle Published Picks

on:
  push:
    branches: [static-deployment]
    paths:
      - '.github/workflows/mlb-settle-published.yml'
      - 'sports/mlb/scripts/settle_published_predictions.py'
      - 'sports/mlb/web/data/history/**'
  workflow_dispatch:

concurrency:
  group: mlb-settle-published-picks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout published MLB history
        uses: actions/checkout@v7
        with:
          ref: static-deployment
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install settlement dependency
        run: python -m pip install requests

      - name: Validate settlement behavior
        run: python -m pytest sports/mlb/tests/test_settle_published_predictions.py -q

      - name: Settle picks from final games
        run: python sports/mlb/scripts/settle_published_predictions.py

      - name: Publish validated history
        run: |
          set -euo pipefail
          python - <<'PY'
          import shutil
          from pathlib import Path
          source = Path("sports/mlb/web/data/history")
          for target in (Path("dist/mlb/data/history"), Path("paywall/private-content/app/mlb/data/history")):
              shutil.copytree(source, target, dirs_exist_ok=True)
          PY
          git add -f -- \
            sports/mlb/web/data/history \
            sports/mlb/data/predictions/settlement/mlb_settlement_report.json \
            dist/mlb/data/history \
            paywall/private-content/app/mlb/data/history
          if git diff --cached --quiet; then
            echo "No newly final MLB picks to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Settle published MLB picks [skip ci]"
          if ! git push origin HEAD:static-deployment; then
            git pull --rebase --autostash origin static-deployment
            git push origin HEAD:static-deployment
          fi

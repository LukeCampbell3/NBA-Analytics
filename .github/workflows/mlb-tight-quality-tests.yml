name: MLB Tight Quality Tests

on:
  push:
    branches: [static-deployment]
    paths:
      - 'sports/mlb/parlay_v2/**'
      - 'sports/mlb/scripts/apply_tight_quality_overlay.py'
      - 'sports/mlb/scripts/apply_parlay_v2_public_quality_overlay.py'
      - 'sports/mlb/scripts/select_high_hit_parlay.py'
      - 'sports/mlb/scripts/local_node_selector.py'
      - 'sports/mlb/scripts/local_node_selector_v2.py'
      - 'sports/mlb/scripts/simulate_local_node_selector_v2.py'
      - 'sports/mlb/scripts/balanced_ranking_v3.py'
      - 'sports/mlb/scripts/prospective_balanced_ranking_v3.py'
      - 'sports/mlb/scripts/balanced_market_ensemble_v4.py'
      - 'sports/mlb/scripts/backtest_balanced_market_ensemble_v4.py'
      - 'sports/mlb/scripts/export_web_prediction_payload.py'
      - 'sports/mlb/scripts/enrich_parlay_leg_betslip.py'
      - 'sports/mlb/scripts/build_exotic_market_shadow.py'
      - 'sports/mlb/scripts/validate_v4_live_players.py'
      - 'sports/site/pipeline/validate_daily_publication.py'
      - 'sports/mlb/web/predictions.js'
      - 'sports/mlb/web/predictions.html'
      - 'sports/mlb/tests/test_parlay_quality_selectors.py'
      - 'sports/mlb/tests/test_tight_quality_overlay.py'
      - 'sports/mlb/tests/test_local_node_selector.py'
      - 'sports/mlb/tests/test_local_node_selector_v2.py'
      - 'sports/mlb/tests/test_simulate_local_node_selector_v2.py'
      - 'sports/mlb/tests/test_balanced_ranking_v3.py'
      - 'sports/mlb/tests/test_prospective_balanced_ranking_v3.py'
      - 'sports/mlb/tests/test_balanced_market_ensemble_v4.py'
      - 'sports/mlb/tests/test_backtest_balanced_market_ensemble_v4.py'
      - 'sports/mlb/tests/test_export_web_prediction_payload.py'
      - 'sports/mlb/tests/test_enrich_parlay_leg_betslip.py'
      - 'sports/mlb/tests/test_validate_daily_publication_v4.py'
      - 'sports/mlb/tests/test_parlay_v2_public_quality_overlay.py'
      - 'sports/mlb/tests/test_same_game_tight_quality.py'
      - 'sports/mlb/tests/test_select_high_hit_parlay.py'
      - 'sports/mlb/tests/test_build_exotic_market_shadow.py'
      - 'sports/mlb/tests/test_validate_v4_live_players.py'
      - 'sports/mlb/tests/test_pitcher_parlay_reliability.py'
      - 'sports/site/pipeline/run_daily_predictions.py'
      - '.github/workflows/mlb-predictions.yml'
      - '.github/workflows/mlb-same-game-predictions.yml'
      - '.github/workflows/mlb-pitcher-parlay-predictions.yml'
      - '.github/workflows/mlb-tight-quality-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tight-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: static-deployment
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run tight MLB selector regressions
        run: |
          python -m pytest \
            sports/mlb/tests/test_tight_quality_overlay.py \
            sports/mlb/tests/test_local_node_selector.py \
            sports/mlb/tests/test_local_node_selector_v2.py \
            sports/mlb/tests/test_simulate_local_node_selector_v2.py \
            sports/mlb/tests/test_balanced_ranking_v3.py \
            sports/mlb/tests/test_prospective_balanced_ranking_v3.py \
            sports/mlb/tests/test_balanced_market_ensemble_v4.py \
            sports/mlb/tests/test_backtest_balanced_market_ensemble_v4.py \
            sports/mlb/tests/test_export_web_prediction_payload.py \
            sports/mlb/tests/test_enrich_parlay_leg_betslip.py \
            sports/mlb/tests/test_validate_daily_publication_v4.py \
            sports/mlb/tests/test_parlay_v2_public_quality_overlay.py \
            sports/mlb/tests/test_same_game_tight_quality.py \
            sports/mlb/tests/test_parlay_quality_selectors.py \
            sports/mlb/tests/test_select_high_hit_parlay.py \
            sports/mlb/tests/test_build_exotic_market_shadow.py \
            sports/mlb/tests/test_validate_v4_live_players.py \
            sports/mlb/tests/test_pitcher_parlay_reliability.py \
            -q
      - name: Validate MLB frontend JavaScript syntax
        run: node --check sports/mlb/web/predictions.js

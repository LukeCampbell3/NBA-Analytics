name: NFL Predictions and Frontend

on:
  schedule:
    - cron: "15 14 * 1-2,8-12 *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "NFL slate date (YYYY-MM-DD); defaults to Eastern today"
        required: false
        type: string
      build_only:
        description: "Validate and rebuild without fetching live odds"
        required: false
        default: false
        type: boolean

concurrency:
  group: nfl-predictions-static-deployment
  cancel-in-progress: false

permissions:
  contents: write

env:
  PUBLISH_BRANCH: static-deployment
  PYTHONUNBUFFERED: "1"
  THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
  SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
  NFL_ODDS_PROVIDER_PRIORITY: ${{ vars.NFL_ODDS_PROVIDER_PRIORITY || 'sportsgameodds,the_odds_api' }}

jobs:
  nfl-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout prediction frontend branch
        uses: actions/checkout@v7
        with:
          ref: static-deployment
          fetch-depth: 0

      - name: Resolve NFL run date
        id: run_date
        env:
          REQUESTED_DATE: ${{ inputs.run_date }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_DATE:-}" ]]; then
            RUN_DATE="$REQUESTED_DATE"
          else
            RUN_DATE="$(TZ=America/New_York date +%F)"
          fi
          python -c "from datetime import date; date.fromisoformat('$RUN_DATE')"
          echo "value=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sports/nfl/requirements.txt

      - name: Restore NFL model and data cache
        uses: actions/cache@v5
        with:
          path: |
            sports/nfl/model
            sports/nfl/data/raw
            sports/nfl/tmp
          key: nfl-runtime-${{ runner.os }}-py311-${{ github.run_id }}
          restore-keys: |
            nfl-runtime-${{ runner.os }}-py311-

      - name: Install NFL dependencies
        run: python -m pip install -r sports/nfl/requirements.txt

      - name: Verify frozen NFL policy
        run: |
          set -euo pipefail
          python sports/nfl/scripts/backtest_nfl_daily_policy.py
          python sports/nfl/scripts/train_nfl_pick_meta_selector.py
          python -m pytest \
            sports/nfl/tests/test_live_market.py \
            sports/nfl/tests/test_pick_meta.py \
            sports/nfl/tests/test_daily_policy_backtest.py \
            sports/nfl/tests/test_validation_web_export.py \
            tests/test_validate_nfl_publication.py \
            -q

      - name: Settle previous day's NFL PARLAY_V2 plays
        if: ${{ !inputs.build_only }}
        run: >-
          python -m sports.nfl.scripts.settle_parlay_v2_calibration
          --run-date "${{ steps.run_date.outputs.value }}"

      - name: Capture complete NFL market slate
        if: ${{ !inputs.build_only }}
        run: >-
          python sports/nfl/scripts/run_nfl_daily_predictions.py
          --run-date "${{ steps.run_date.outputs.value }}"
          --snapshot-output
          "sports/nfl/data/production/snapshots/${{ steps.run_date.outputs.value }}/${{ github.run_id }}.json"
          --capture-only

      - name: Refresh current NFL skill roster
        if: ${{ !inputs.build_only }}
        run: |
          set -euo pipefail
          RUN_DATE="${{ steps.run_date.outputs.value }}"
          python sports/nfl/scripts/refresh_nfl_current_roster.py \
            --season "${RUN_DATE%%-*}" \
            --manifest sports/nfl/tmp/current_skill_roster_manifest.json

      - name: Refresh current NFL fantasy depth chart
        run: |
          set -euo pipefail
          RUN_DATE="${{ steps.run_date.outputs.value }}"
          python sports/nfl/scripts/refresh_nfl_depth_chart.py \
            --season "${RUN_DATE%%-*}"

      - name: Inspect NFL market coverage
        if: ${{ !inputs.build_only }}
        id: market_coverage
        run: |
          set -euo pipefail
          SNAPSHOT="sports/nfl/data/production/snapshots/${{ steps.run_date.outputs.value }}/${{ github.run_id }}.json"
          HAS_MARKETS="$(python -c "import json; print('true' if json.load(open('$SNAPSHOT', encoding='utf-8')).get('observations') else 'false')")"
          echo "has_markets=$HAS_MARKETS" >> "$GITHUB_OUTPUT"

      - name: Bootstrap cached NFL artifacts
        if: ${{ !inputs.build_only && steps.market_coverage.outputs.has_markets == 'true' }}
        run: python sports/nfl/scripts/bootstrap_nfl_artifacts.py

      - name: Refresh completed-week model state
        if: ${{ !inputs.build_only && steps.market_coverage.outputs.has_markets == 'true' }}
        run: >-
          python sports/nfl/scripts/refresh_nfl_yardage_artifact.py
          --run-date "${{ steps.run_date.outputs.value }}"

      - name: Build current NFL slate
        if: ${{ !inputs.build_only }}
        run: >-
          python sports/nfl/scripts/run_nfl_daily_predictions.py
          --run-date "${{ steps.run_date.outputs.value }}"
          --market-input
          "sports/nfl/data/production/snapshots/${{ steps.run_date.outputs.value }}/${{ github.run_id }}.json"
          --snapshot-output
          "sports/nfl/data/production/snapshots/${{ steps.run_date.outputs.value }}/${{ github.run_id }}.json"

      - name: Run PARLAY_POLICY_V2 (Parlays tab)
        if: ${{ !inputs.build_only }}
        run: |
          set -euo pipefail
          python -m sports.nfl.scripts.stage_parlay_v2 --run-date "${{ steps.run_date.outputs.value }}"

      - name: Export and build NFL frontend
        run: |
          set -euo pipefail
          RUN_DATE="${{ steps.run_date.outputs.value }}"
          python sports/nfl/scripts/export_nfl_validation_web.py
          python sports/nfl/scripts/build_fantasy_draft_rankings.py \
            --season "${RUN_DATE%%-*}"
          LIVE_SNAPSHOT="sports/nfl/data/production/snapshots/${{ steps.run_date.outputs.value }}/${{ github.run_id }}.json"
          WEEK_SNAPSHOT="sports/nfl/data/production/snapshots/2026-09-09/week1_pool.json"
          if [[ "$RUN_DATE" > "2026-09-01" && "$RUN_DATE" < "2026-09-15" && -f "$LIVE_SNAPSHOT" ]]; then
            python sports/nfl/scripts/build_nfl_week_pool.py \
              --season 2026 --week 1 --market-snapshot "$LIVE_SNAPSHOT"
          elif [[ -f "$WEEK_SNAPSHOT" ]]; then
            python sports/nfl/scripts/build_nfl_week_pool.py \
              --season 2026 --week 1 --market-snapshot "$WEEK_SNAPSHOT"
          else
            python sports/nfl/scripts/build_nfl_week_pool.py --season 2026 --week 1
          fi
          python sports/site/pipeline/build_static_site.py
          if [[ "${{ inputs.build_only }}" == "true" ]]; then
            python sports/site/pipeline/validate_nfl_publication.py
          else
            python sports/site/pipeline/validate_nfl_publication.py \
              --run-date "${{ steps.run_date.outputs.value }}"
          fi

      - name: Stage NFL publication only
        id: staged
        run: |
          set -euo pipefail
          git add -f -- \
            sports/nfl/data/evaluation/daily_policy_backtest.json \
            sports/nfl/data/evaluation/pick_meta_backtest.json \
            sports/nfl/data/evaluation/fantasy_draft_validation.json \
            sports/nfl/data/reference/current_depth_chart.csv \
            sports/nfl/data/reference/current_depth_chart_manifest.json \
            sports/nfl/data/reference/current_skill_roster.csv \
            sports/nfl/web/data/daily_predictions.json \
            sports/nfl/web/data/fantasy_draft_rankings.json \
            sports/nfl/web/data/week_1_pool.json \
            sports/nfl/web/data/market_validation_summary.json \
            dist/nfl/data/daily_predictions.json \
            dist/nfl/data/fantasy_draft_rankings.json \
            dist/nfl/data/week_1_pool.json \
            dist/nfl/data/market_validation_summary.json
          SNAPSHOT="sports/nfl/data/production/snapshots/${{ steps.run_date.outputs.value }}/${{ github.run_id }}.json"
          if [[ "${{ inputs.build_only }}" != "true" && -f "$SNAPSHOT" ]]; then
            git add -f -- "$SNAPSHOT"
          fi
          # These PARLAY_V2 paths are lazily created (e.g. the weekly
          # plays archive only exists once a week actually has
          # action-eligible plays) -- `git add -f` on a literal
          # nonexistent pathspec fails hard under `set -e`, so only add
          # each one if it's actually on disk this run (same guard MLB's
          # workflow uses for its own lazily-created PARLAY_V2 paths).
          for optional_path in \
            sports/nfl/parlay_v2/calibration/reports/calibration_ledger.jsonl \
            sports/nfl/parlay_v2/calibration/reports/pair_observation_ledger.jsonl \
            sports/nfl/parlay_v2/reports \
            sports/nfl/research/parlay_certification_v2/reports
          do
            if [ -e "$optional_path" ]; then
              git add -f -- "$optional_path"
            fi
          done
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Commit and push NFL publication
        if: steps.staged.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "NFL predictions ${{ steps.run_date.outputs.value }} [skip ci]"
          if ! git push origin "HEAD:$PUBLISH_BRANCH"; then
            git pull --rebase --autostash origin "$PUBLISH_BRANCH"
            git push origin "HEAD:$PUBLISH_BRANCH"
          fi

      - name: Upload NFL publication diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nfl-predictions-${{ github.run_id }}
          path: |
            sports/nfl/data/evaluation/daily_policy_backtest.json
            sports/nfl/data/evaluation/pick_meta_backtest.json
            sports/nfl/data/evaluation/fantasy_draft_validation.json
            sports/nfl/data/reference/current_depth_chart_manifest.json
            sports/nfl/data/production/snapshots/${{ steps.run_date.outputs.value }}/${{ github.run_id }}.json
            sports/nfl/web/data/daily_predictions.json
            sports/nfl/web/data/fantasy_draft_rankings.json
            sports/nfl/web/data/week_1_pool.json
            sports/nfl/web/data/market_validation_summary.json
            dist/nfl/data/daily_predictions.json
            dist/nfl/data/market_validation_summary.json
          if-no-files-found: warn
          retention-days: 14

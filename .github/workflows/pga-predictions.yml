name: PGA Golf Predictions and Frontend

on:
  schedule:
    # Daily during the real PGA Tour season window (Jan-Dec covers the
    # regular season, the FedEx Cup playoffs, and the fall series) -- the
    # pipeline itself reports an honest no-event/field-not-posted state on
    # any real off week rather than needing the cron to guess event weeks.
    - cron: "12 13 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      build_only:
        description: "Rebuild and validate the existing PGA publication without a live fetch"
        required: false
        default: false
        type: boolean

concurrency:
  group: pga-predictions-static-deployment
  cancel-in-progress: false

permissions:
  contents: write

env:
  PUBLISH_BRANCH: static-deployment
  PYTHONUNBUFFERED: "1"
  TZ: America/New_York
  THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}

jobs:
  pga-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout prediction frontend branch
        uses: actions/checkout@v7
        with:
          ref: static-deployment
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sports/golf/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r sports/golf/requirements.txt

      - name: Run PGA golf tests
        run: python -m pytest sports/golf/tests/ -q

      - name: Run PGA daily prediction pipeline
        if: ${{ !inputs.build_only }}
        run: |
          set -euo pipefail
          python sports/golf/scripts/run_pga_daily_predictions.py

      - name: Cache golf player headshots
        if: ${{ !inputs.build_only }}
        run: |
          set -euo pipefail
          python sports/golf/scripts/update_golf_player_headshot_cache.py \
            --daily-predictions-path sports/golf/web/data/daily_predictions.json

      - name: Build static site
        run: python sports/site/pipeline/build_static_site.py

      - name: Stage PGA publication
        id: staged
        run: |
          set -euo pipefail
          git add -f -- \
            sports/golf/web/data/daily_predictions.json \
            sports/golf/data/raw/espn \
            dist/golf \
            dist/data/sports.json \
            paywall/private-content/app/golf
          # The headshot cache is lazily created (only once a real,
          # priced candidate carries a real headshot URL to fetch).
          if [ -e sports/golf/web/data/headshots ]; then
            git add -f -- sports/golf/web/data/headshots
          fi
          # The calibration ledger is lazily created (only once a real
          # candidate is first admitted via a future settlement step) --
          # same guard every other sport's workflow uses for its own
          # lazily-created PARLAY_V2 paths.
          if [ -e sports/golf/parlay_v2/calibration/reports/calibration_ledger.jsonl ]; then
            git add -f -- sports/golf/parlay_v2/calibration/reports/calibration_ledger.jsonl
          fi
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Commit and push PGA publication
        if: steps.staged.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "PGA golf predictions $(date -u +%F) [skip ci]"
          if ! git push origin "HEAD:$PUBLISH_BRANCH"; then
            git pull --rebase --autostash origin "$PUBLISH_BRANCH"
            git push origin "HEAD:$PUBLISH_BRANCH"
          fi

      - name: Upload PGA publication diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pga-predictions-${{ github.run_id }}
          path: |
            sports/golf/web/data/daily_predictions.json
            dist/golf/data/daily_predictions.json
          if-no-files-found: warn
          retention-days: 14

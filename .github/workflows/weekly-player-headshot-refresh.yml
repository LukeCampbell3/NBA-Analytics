name: Weekly Player Headshot Refresh

# The daily prediction workflows (mlb/nba/pga-predictions.yml) already
# cache each real bettable player's headshot the first time that player
# appears on a board -- see sports/{mlb,nba,golf}/*/update_*_player_
# headshot_cache.py. This weekly job re-fetches every real player id
# already in each sport's cache (force-refresh), so a stale or since-
# updated real photo (a trade, a new season image, a roster change) gets
# refreshed on a real cadence instead of only ever being fetched once.
# Never adds a fabricated entry -- an id whose real re-fetch fails simply
# keeps its previously cached real image.

on:
  schedule:
    - cron: "0 9 * * 0" # Sundays 09:00 UTC
  workflow_dispatch: {}

concurrency:
  group: weekly-player-headshot-refresh
  cancel-in-progress: false

permissions:
  contents: write

env:
  PUBLISH_BRANCH: static-deployment
  PYTHONUNBUFFERED: "1"

jobs:
  refresh-headshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout prediction frontend branch
        uses: actions/checkout@v7
        with:
          ref: static-deployment
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Refresh MLB player headshots
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -e sports/mlb/web/data/daily_predictions.json ]; then
            python sports/mlb/scripts/update_mlb_player_headshot_cache.py \
              --daily-predictions-path sports/mlb/web/data/daily_predictions.json \
              --daily-predictions-path dist/mlb/data/daily_predictions.json \
              --daily-predictions-path paywall/private-content/app/mlb/data/daily_predictions.json \
              --force-refresh
          fi

      - name: Refresh NBA player headshots
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -e sports/nba/web/data/daily_predictions.json ]; then
            python sports/nba/predictions/Player-Predictor/scripts/update_nba_player_headshot_cache.py \
              --daily-predictions-path sports/nba/web/data/daily_predictions.json \
              --daily-predictions-path dist/nba/data/daily_predictions.json \
              --force-refresh
          fi

      - name: Refresh golf player headshots
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -e sports/golf/web/data/daily_predictions.json ]; then
            python sports/golf/scripts/update_golf_player_headshot_cache.py \
              --daily-predictions-path sports/golf/web/data/daily_predictions.json \
              --daily-predictions-path dist/golf/data/daily_predictions.json \
              --daily-predictions-path paywall/private-content/app/golf/data/daily_predictions.json \
              --force-refresh
          fi

      - name: Stage refreshed headshots
        id: staged
        run: |
          set -euo pipefail
          for path in \
            sports/mlb/web/data/headshots dist/mlb/data/headshots paywall/private-content/app/mlb/data/headshots \
            sports/nba/web/data/headshots dist/nba/data/headshots \
            sports/golf/web/data/headshots dist/golf/data/headshots paywall/private-content/app/golf/data/headshots \
            sports/mlb/web/data/daily_predictions.json dist/mlb/data/daily_predictions.json paywall/private-content/app/mlb/data/daily_predictions.json \
            sports/nba/web/data/daily_predictions.json dist/nba/data/daily_predictions.json \
            sports/golf/web/data/daily_predictions.json dist/golf/data/daily_predictions.json paywall/private-content/app/golf/data/daily_predictions.json
          do
            if [ -e "$path" ]; then
              git add -f -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Commit and push refreshed headshots
        if: steps.staged.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Weekly player headshot refresh $(date -u +%F) [skip ci]"
          if ! git push origin "HEAD:$PUBLISH_BRANCH"; then
            git pull --rebase --autostash origin "$PUBLISH_BRANCH"
            git push origin "HEAD:$PUBLISH_BRANCH"
          fi

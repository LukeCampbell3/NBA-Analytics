# Card Families Configuration
# Defines card families, materials, and their visual properties

families:
  standard:
    label: "Standard"
    materials:
      chrome:
        label: "Chrome"
        description: "Metallic chrome finish"
        color_schemes:
          - ["#2C3E50", "#ECF0F1"]  # Dark blue / Light gray
          - ["#34495E", "#BDC3C7"]  # Slate blue / Silver
        texture: "textures/chrome.png"
        foil_opacity: 0.8
        grain_opacity: 0.1
        
      refractor:
        label: "Refractor"
        description: "Holographic prism effect"
        color_schemes:
          - ["#1A237E", "#00BCD4"]  # Indigo / Cyan
          - ["#311B92", "#7C4DFF"]  # Deep purple / Light purple
        texture: "textures/refractor.png"
        foil_opacity: 0.9
        grain_opacity: 0.05

  fit:
    label: "Fit"
    materials:
      blue-ice:
        label: "Blue Ice"
        description: "High fit score variant"
        color_schemes:
          - ["#0D47A1", "#29B6F6"]  # Dark blue / Light blue
          - ["#01579B", "#4FC3F7"]  # Blue / Sky blue
        texture: "textures/blue-ice.png"
        foil_opacity: 0.7
        grain_opacity: 0.2
        
      zebra-ice:
        label: "Zebra Ice"
        description: "Medium-high fit score"
        color_schemes:
          - ["#212121", "#E0E0E0"]  # Black / Light gray
          - ["#37474F", "#CFD8DC"]  # Blue gray / Light blue gray
        texture: "textures/zebra-ice.png"
        foil_opacity: 0.6
        grain_opacity: 0.3
        
      tiger-ice:
        label: "Tiger Ice"
        description: "Medium fit score"
        color_schemes:
          - ["#BF360C", "#FFAB91"]  # Deep orange / Light orange
          - ["#DD2C00", "#FF9E80"]  # Orange / Peach
        texture: "textures/tiger-ice.png"
        foil_opacity: 0.5
        grain_opacity: 0.4
        
      black-ice:
        label: "Black Ice"
        description: "Low fit score"
        color_schemes:
          - ["#000000", "#616161"]  # Black / Gray
          - ["#263238", "#78909C"]  # Dark blue gray / Blue gray
        texture: "textures/black-ice.png"
        foil_opacity: 0.4
        grain_opacity: 0.5

  value:
    label: "Value"
    materials:
      auto:
        label: "Auto"
        description: "Autograph style"
        color_schemes:
          - ["#1B5E20", "#C8E6C9"]  # Dark green / Light green
          - ["#33691E", "#AED581"]  # Green / Light green
        texture: "textures/auto.png"
        foil_opacity: 0.3
        grain_opacity: 0.6
        
      patch:
        label: "Patch"
        description: "Jersey patch window"
        color_schemes:
          - ["#B71C1C", "#FFCDD2"]  # Dark red / Light red
          - ["#C62828", "#EF9A9A"]  # Red / Pink
        texture: "textures/patch.png"
        foil_opacity: 0.4
        grain_opacity: 0.5
        
      manga:
        label: "Manga"
        description: "Comic book style"
        color_schemes:
          - ["#4A148C", "#E1BEE7"]  # Purple / Light purple
          - ["#6A1B9A", "#CE93D8"]  # Deep purple / Light purple
        texture: "textures/manga.png"
        foil_opacity: 0.5
        grain_opacity: 0.4
        
      auto-patch:
        label: "Auto-Patch"
        description: "Combined auto + patch"
        color_schemes:
          - ["#004D40", "#B2DFDB"]  # Dark teal / Light teal
          - ["#00695C", "#80CBC4"]  # Teal / Light teal
        texture: "textures/auto-patch.png"
        foil_opacity: 0.6
        grain_opacity: 0.3


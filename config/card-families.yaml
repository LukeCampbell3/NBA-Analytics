# Assignment rules
assignment_rules:
  # Value score thresholds
  value_score:
    high: 75
    medium: 60
    low: 45
  
  # Fit score thresholds  
  fit_score:
    high: 80
    medium: 65
    low: 50
  
  # Age thresholds
  age:
    rookie_max: 22
    veteran_min: 30
  
  # Card family assignment logic
  family_assignment:
    - condition: "value_score >= high"
      family: "value"
      priority: 1
      
    - condition: "fit_score >= high"
      family: "fit"
      priority: 2
      
    - condition: "age <= rookie_max"
      family: "standard"
      material: "chrome"
      priority: 3
      
    - condition: "default"
      family: "standard"
      material: "refractor"
      priority: 4
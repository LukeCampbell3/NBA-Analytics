<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Current NBA and MLB model prediction boards with status, freshness, and methodology.">
    <title>Prediction Desk</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="vault/vault-tokens.css?v=3">
    <link rel="stylesheet" href="vault/vault-components.css?v=6">
    <link rel="stylesheet" href="vault/prediction-pages.css?v=1">
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body class="vault-theme">
    <div id="vaultShellRoot"></div>

    <main class="vault-shell site-shell">
        <header class="desk-header">
            <p class="desk-kicker">Prediction Analytics</p>
            <div class="vault-heading-row">
                <h1>Prediction Desk</h1>
                <button class="vault-info-trigger" type="button" aria-label="About the prediction desk" data-info="Current model boards and their supporting methodology, organized by sport.">i</button>
            </div>
            <p>Review the latest model boards, publication status, and data freshness from one consistent workspace.</p>
        </header>

        <section class="desk-board-section" aria-labelledby="currentBoardsHeading">
            <div class="desk-section-heading">
                <div>
                    <p class="desk-section-kicker">Current Workspaces</p>
                    <h2 id="currentBoardsHeading">Prediction boards</h2>
                </div>
                <p id="deskSummary" class="desk-summary" aria-live="polite">Loading current board status...</p>
            </div>
            <div id="sportsGrid" class="desk-board-grid" aria-live="polite">
                <article class="desk-board-card desk-board-card--loading" aria-hidden="true"></article>
                <article class="desk-board-card desk-board-card--loading" aria-hidden="true"></article>
            </div>
        </section>
    </main>

    <script src="vault/vault-components.js?v=6"></script>
    <script src="vault/vault-shell.js?v=5"></script>
    <script src="app.js?v=4"></script>
</body>
</html>

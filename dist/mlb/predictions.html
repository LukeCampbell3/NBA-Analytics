<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Analytics | Prediction Board</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="vault/vault-tokens.css?v=1">
    <link rel="stylesheet" href="vault/vault-components.css?v=4">
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body class="vault-theme">
    <div id="vaultShellRoot"></div>

    <main class="vault-shell predictions-page">
        <header class="vault-page-header">
            <p class="vault-page-kicker">MLB</p>
            <div class="vault-heading-row">
                <h1>Prediction Board</h1>
                <button class="vault-info-trigger" type="button" aria-label="About prediction board" data-info="Sorted model signals with market line, projection, model estimate, push exposure, and review status.">i</button>
            </div>
            <p id="predictionRunMeta" class="vault-freshness">Loading board details...</p>
        </header>

        <div id="predictionCards" class="vault-board" aria-live="polite"></div>
        <div id="predictionEmpty" class="vault-empty" style="display:none;" role="status">
            <h3>No predictions published</h3>
            <p>No analytical signals are available for this run.</p>
        </div>
    </main>

    <script src="vault/vault-components.js?v=4"></script>
    <script src="vault/vault-shell.js?v=3"></script>
    <script src="predictions.js?v=5"></script>
</body>
</html>

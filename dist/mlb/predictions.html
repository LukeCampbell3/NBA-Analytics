<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Current MLB model predictions with market line, projection, edge, and publication status.">
    <title>MLB Bounty Board | Prediction Bounties</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/vault/vault-tokens.css?v=4">
    <link rel="stylesheet" href="/vault/vault-components.css?v=7">
    <link rel="stylesheet" href="/vault/prediction-pages.css?v=4">
    <link rel="stylesheet" href="parlay-board.css?v=5">
</head>
<body class="vault-theme">
    <div id="vaultShellRoot"></div>

    <main class="vault-shell predictions-page">
        <header class="vault-page-header">
            <p class="vault-page-kicker">MLB Bounty Ledger</p>
            <div class="vault-heading-row">
                <h1>MLB Bounty Board</h1>
                <button class="vault-info-trigger" type="button" aria-label="About prediction board" data-info="Sorted model signals with market line, projection, model estimate, push exposure, and review status.">i</button>
            </div>
            <p class="prediction-page-lead">Current player-stat bounties ranked by model value, with market context and publication controls visible on every notice.</p>
            <div id="predictionRunMeta" class="prediction-run-meta" aria-live="polite">Loading board details...</div>
            <nav id="predictionDateNav" class="date-nav" aria-label="Prediction board date"></nav>
        </header>

        <!-- PARLAY_POLICY_V2 -- the only source of the Parlays product.
             Sourced ONLY from payload.parlays. The legacy ticket system's
             legs are folded into Solo Bets below (see renderCards /
             buildSoloBetsFromLegacyParlay) rather than shown as a
             separate "parlay" claim -- that system was never V2-certified,
             so it never gets parlay framing. -->
        <section id="parlayV2Section" class="daily-parlay daily-parlay--v2" aria-labelledby="parlayV2Title" aria-live="polite">
            <div id="parlayV2Content"></div>
        </section>

        <!-- Same-Game Parlay -- real cross-market (moneyline + full total +
             F5 total) combos for today's slate, priced with the joint
             probability read off a shared Monte Carlo simulation (real
             dependence modeling, never an independence-product shortcut).
             Sourced from its own data/same_game_predictions.json, entirely
             separate from the legacy/V2 player-prop parlay products above.
             This is a brand-new policy with an empty calibration ledger, so
             every combo here is honestly "Shadow only" until real settled
             evidence accumulates -- never presented as certified or a lock. -->
        <section id="sameGameParlaySection" class="daily-parlay daily-parlay--same-game" aria-labelledby="sameGameParlayTitle" aria-live="polite">
            <div id="sameGameParlayContent"></div>
        </section>

        <div class="prediction-section-heading">
            <p class="vault-page-kicker">Solo bets</p>
            <h2 id="predictionPoolTitle">Current Pool</h2>
        </div>
        <div id="predictionCards" class="vault-board" aria-live="polite"></div>
        <div id="predictionEmpty" class="vault-empty" style="display:none;" role="status">
            <h3>No predictions published</h3>
            <p>No analytical signals are available for this run.</p>
        </div>
    </main>

    <script src="/vault/vault-components.js?v=8"></script>
    <script src="/vault/vault-shell.js?v=7"></script>
    <script src="predictions.js?v=16"></script>
</body>
</html>

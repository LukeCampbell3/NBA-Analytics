<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="2026 NFL Week 1 QB, RB, WR, and TE yardage projections with calibrated ranges.">
    <title>NFL Projections | In The Cards Analytics</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/vault/vault-tokens.css?v=10">
    <link rel="stylesheet" href="/vault/vault-components.css?v=10">
    <link rel="stylesheet" href="/vault/prediction-pages.css?v=11">
    <link rel="stylesheet" href="predictions.css?v=1">
</head>
<body class="vault-theme" data-nfl-page="projections">
    <div id="vaultShellRoot"></div>
    <main class="vault-shell predictions-page">
        <header class="vault-page-header">
            <p class="vault-page-kicker">NFL &middot; Week 1</p>
            <div class="vault-heading-row">
                <h1>Projections</h1>
                <button class="vault-info-trigger" type="button" aria-label="About this page" data-info="Current QB, RB, WR, and TE primary-yardage projections use current teams, Week 1 opponents, depth roles, and the frozen yardage model.">i</button>
            </div>
            <p class="prediction-page-lead">Player performance forecasts and holdout-calibrated ranges. For qualified sportsbook signals, open the Picks page.</p>
            <p id="runFacts" class="prediction-run-meta">Loading Week 1 projections...</p>
        </header>
        <section class="pool-primary" aria-label="NFL player projections">
            <div class="pool-section-heading"><h2>Projection Status</h2></div>
            <div id="weekPoolStatus" class="prediction-about-callout"></div>
            <div id="weekPoolMetrics" class="prediction-about-metric-grid"></div>
            <div class="pool-section-heading week-pool-heading" style="margin-top:32px;">
                <h2>Player Projections</h2>
                <div id="weekPositionFilters" class="week-position-filters" role="group" aria-label="Filter projections by position"><button type="button" class="is-active" data-position="ALL">All</button><button type="button" data-position="QB">QB</button><button type="button" data-position="RB">RB</button><button type="button" data-position="WR">WR</button><button type="button" data-position="TE">TE</button></div>
            </div>
            <div id="weekProjectionPool" class="prediction-about-table-wrap"></div>
        </section>
        <footer class="pool-status"><div class="pool-status__row"><span class="prediction-run-meta__item">Projections are model forecasts, not sportsbook picks.</span><a class="pool-status__link" href="/nfl/picks/">View NFL picks &rarr;</a></div></footer>
    </main>
    <script>
        window.setTimeout(() => {
            const status = document.getElementById("runFacts");
            if (!status || !status.textContent.includes("Loading")) return;
            status.innerHTML = "<strong>Projections did not finish loading.</strong> Reload the page to try again.";
            const pool = document.getElementById("weekProjectionPool");
            if (pool) pool.innerHTML = '<div class="vault-empty" role="alert"><h3>Projections unavailable</h3><p>The current projection pool could not be loaded.</p></div>';
        }, 12000);
    </script>
    <script src="/vault/vault-components.js?v=18"></script>
    <script src="/vault/vault-shell.js?v=9"></script>
    <script src="predictions.js?v=10"></script>
</body>
</html>

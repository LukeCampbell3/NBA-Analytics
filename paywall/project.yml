packages:
  - name: paywall
    functions:
      - name: gateway
        runtime: go:1.25
        main: Main
        web: raw
        limits:
          timeout: 15000
          memory: 128
          logs: 256
        environment:
          PUBLIC_ORIGIN: "${PUBLIC_ORIGIN}"
          GATEWAY_PUBLIC_PATH_PREFIX: "${GATEWAY_PUBLIC_PATH_PREFIX}"
          DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID}"
          DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET}"
          DISCORD_REDIRECT_URI: "${DISCORD_REDIRECT_URI}"
          R2_STATE_ENDPOINT: "${R2_STATE_ENDPOINT}"
          R2_STATE_ACCESS_KEY_ID: "${R2_STATE_ACCESS_KEY_ID}"
          R2_STATE_SECRET_ACCESS_KEY: "${R2_STATE_SECRET_ACCESS_KEY}"
          R2_STATE_BUCKET: "${R2_STATE_BUCKET}"
          R2_CONTENT_ENDPOINT: "${R2_CONTENT_ENDPOINT}"
          R2_CONTENT_ACCESS_KEY_ID: "${R2_CONTENT_ACCESS_KEY_ID}"
          R2_CONTENT_SECRET_ACCESS_KEY: "${R2_CONTENT_SECRET_ACCESS_KEY}"
          R2_CONTENT_BUCKET: "${R2_CONTENT_BUCKET}"
          DISCORD_INDEX_KEY_CURRENT: "${DISCORD_INDEX_KEY_CURRENT}"
          DISCORD_INDEX_KEY_PREVIOUS: "${DISCORD_INDEX_KEY_PREVIOUS}"
          SESSION_KEY_CURRENT_ID: "${SESSION_KEY_CURRENT_ID}"
          SESSION_KEY_CURRENT: "${SESSION_KEY_CURRENT}"
          SESSION_KEY_PREVIOUS_ID: "${SESSION_KEY_PREVIOUS_ID}"
          SESSION_KEY_PREVIOUS: "${SESSION_KEY_PREVIOUS}"
          SESSION_ISSUER: "${SESSION_ISSUER}"
          SESSION_AUDIENCE: "${SESSION_AUDIENCE}"
          PII_ENCRYPTION_KEY_CURRENT_ID: "${PII_ENCRYPTION_KEY_CURRENT_ID}"
          PII_ENCRYPTION_KEY_CURRENT: "${PII_ENCRYPTION_KEY_CURRENT}"
          PII_ENCRYPTION_KEY_PREVIOUS_ID: "${PII_ENCRYPTION_KEY_PREVIOUS_ID}"
          PII_ENCRYPTION_KEY_PREVIOUS: "${PII_ENCRYPTION_KEY_PREVIOUS}"
          CSRF_SIGNING_KEY: "${CSRF_SIGNING_KEY}"
          PAYMENT_SECRET_KEY: "${PAYMENT_SECRET_KEY}"
          PAYMENT_PRICE_ID: "${PAYMENT_PRICE_ID}"
          ALLOWED_LOGIN_REDIRECTS: "${ALLOWED_LOGIN_REDIRECTS}"
      - name: payment-webhook
        runtime: go:1.25
        main: Main
        web: raw
        limits:
          timeout: 15000
          memory: 128
          logs: 256
        environment:
          R2_STATE_ENDPOINT: "${R2_STATE_ENDPOINT}"
          R2_STATE_ACCESS_KEY_ID: "${R2_STATE_ACCESS_KEY_ID}"
          R2_STATE_SECRET_ACCESS_KEY: "${R2_STATE_SECRET_ACCESS_KEY}"
          R2_STATE_BUCKET: "${R2_STATE_BUCKET}"
          PAYMENT_SECRET_KEY: "${PAYMENT_SECRET_KEY}"
          PAYMENT_WEBHOOK_SECRET: "${PAYMENT_WEBHOOK_SECRET}"
          PAYMENT_PRICE_ID: "${PAYMENT_PRICE_ID}"
          PAYMENT_WEBHOOK_MAX_BYTES: "262144"
          PII_ENCRYPTION_KEY_CURRENT_ID: "${PII_ENCRYPTION_KEY_CURRENT_ID}"
          PII_ENCRYPTION_KEY_CURRENT: "${PII_ENCRYPTION_KEY_CURRENT}"

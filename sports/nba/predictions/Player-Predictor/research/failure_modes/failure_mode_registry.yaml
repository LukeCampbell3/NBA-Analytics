        description: "Increase assist-over stress when team conversion support is weak."
      - intervention_type: price_dependent_tier
        description: "Move borderline assist overs into price-dependent territory."
    allowed_penalties_gates: [scenario_stress_increase, price_dependent_tier]
    opposite_side_discovery_rules: [require_valid_price]
    validation_segments: [LOW_TEAM_ASSIST_ENVIRONMENT]
    promotion_requirements: [trained_bundle_replay_required, broader_walk_forward_required, no_op_narrowness_required, active_window_improvement_required]
    known_risks_overfit_traps: [assist_box_score_variance, hot_shooting_fallback, opponent_scheme_noise]
  - failure_mode_id: POOR_SHOOTING_ENVIRONMENT

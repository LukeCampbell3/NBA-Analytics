schema_version: 1
failure_modes:
  - failure_mode_id: REBOUND_UPPER_BAND_SUPPLY_RISK
    market_families: [TRB, RA, PRA, PARLAY]
    candidate_symptoms: [TRB_OVER, line_above_recent_q75, high_supply_dependency]
    required_pre_event_features: [trb_q75_recent, trb_q90_recent, projected_missed_fga_total, rebound_supply_score]
    postgame_attribution_signals: [actual_trb_below_line, efficient_shooting_environment, weak_rebound_event_volume]
    likely_causal_pathway: "Upper-band rebound overs require both missed-shot supply and stable rebound concentration."
    candidate_interventions:
      - intervention_type: price_dependent_tier
        description: "Downgrade upper-band rebound overs unless supply and share both support the line."
      - intervention_type: opposite_side_discovery
        description: "Evaluate the rebound under when the over is heavily penalized."
    allowed_penalties_gates: [soft_downgrade, price_dependent_tier, board_objective_penalty_term]
    opposite_side_discovery_rules: [require_valid_price, require_break_even_win, require_positive_lcb]
    validation_segments: [TRB_OVER_UPPER_BAND]
    promotion_requirements: [trained_bundle_replay_required, broader_walk_forward_required, no_op_narrowness_required, active_window_improvement_required]
    known_risks_overfit_traps: [single_player_lines, median_band_confusion, over_penalizing_low_lines]
  - failure_mode_id: REBOUND_LOW_LINE_ROLE_VOLATILITY
    market_families: [TRB, RA, PRA]
    candidate_symptoms: [TRB_OVER, low_line, unstable_minutes_band, bench_role]
    required_pre_event_features: [minutes_floor_recent, expected_minutes_band_width, bench_role_flag, rotation_volatility_score]
    postgame_attribution_signals: [actual_minutes_below_band, rotation_instability, did_not_reach_rebound_volume]
    likely_causal_pathway: "Low rebound lines still fail when minutes and role are structurally unstable."
    candidate_interventions:
      - intervention_type: soft_downgrade
        description: "Reduce confidence for low-line rebound overs when role volatility is elevated."
      - intervention_type: hard_gate
        description: "Block structurally unsafe minutes-floor cases."
    allowed_penalties_gates: [soft_downgrade, hard_gate, forecastability_penalty]
    opposite_side_discovery_rules: [require_valid_price, require_break_even_win]
    validation_segments: [TRB_OVER_LOW_LINE_ROLE_VOLATILE]
    promotion_requirements: [trained_bundle_replay_required, broader_walk_forward_required, no_op_narrowness_required, active_window_improvement_required]
    known_risks_overfit_traps: [bench_noise, reacting_to_small_sample_minutes, injury_news_leakage]
  - failure_mode_id: REBOUND_SHARE_COMPETITION
    market_families: [TRB, RA, PRA, PARLAY]
    candidate_symptoms: [TRB_OVER, teammate_rebound_competition, wing_leakage]
    required_pre_event_features: [teammate_rebound_competition_score, player_rebound_share_std, wing_rebound_leakage_score]
    postgame_attribution_signals: [teammate_rebounds_distributed, weak_player_rebound_share, broad_frontcourt_split]
    likely_causal_pathway: "Available rebounds are spread across teammates instead of concentrating through the selected player."
    candidate_interventions:
      - intervention_type: soft_downgrade
        description: "Apply share-competition penalty before board selection."
      - intervention_type: board_objective_penalty_term
        description: "Penalize rebound-share instability in the board objective."
    allowed_penalties_gates: [soft_downgrade, board_objective_penalty_term, price_dependent_tier]
    opposite_side_discovery_rules: [require_valid_price, require_positive_lcb]
    validation_segments: [TRB_OVER_SHARE_COMPETITION]
    promotion_requirements: [trained_bundle_replay_required, broader_walk_forward_required, no_op_narrowness_required, active_window_improvement_required]
    known_risks_overfit_traps: [teammate_box_score_noise, lineup_context_shift, double_counting_supply]
  - failure_mode_id: REBOUND_SUPPLY_COLLAPSE
    market_families: [TRB, RA, PRA, PARLAY]
    candidate_symptoms: [TRB_OVER, low_missed_shot_environment, high_team_efficiency]
    required_pre_event_features: [projected_missed_fga_total, projected_team_fg_pct, projected_opponent_fg_pct, pace_rebound_environment]
    postgame_attribution_signals: [few_missed_shots, efficient_shooting_environment, low_available_rebounds]
    likely_causal_pathway: "Rebound-event supply collapses because both teams shoot too efficiently."
    candidate_interventions:
      - intervention_type: scenario_stress_increase
        description: "Increase stress probability for rebound overs in weak missed-shot environments."
      - intervention_type: opposite_side_discovery
        description: "Consider the rebound under when supply is clearly hostile."
    allowed_penalties_gates: [scenario_stress_increase, soft_downgrade, price_dependent_tier]
    opposite_side_discovery_rules: [require_valid_price, require_break_even_win, require_positive_lcb]
    validation_segments: [TRB_OVER_SUPPLY_DEPENDENT]
    promotion_requirements: [trained_bundle_replay_required, broader_walk_forward_required, no_op_narrowness_required, active_window_improvement_required]
    known_risks_overfit_traps: [team_efficiency_noise, pace_double_counting, opponent_shooting_regression]
  - failure_mode_id: TEAM_OFFENSE_COLLAPSE
    market_families: [AST, PTS, PRA, PARLAY]
    candidate_symptoms: [same_team_over_stack, low_team_total, weak_creation_environment]
    required_pre_event_features: [team_total, pace_proxy, offensive_rating_proxy, teammate_return_risk]
    postgame_attribution_signals: [team_points_below_expectation, low_assist_total, low_conversion]
    likely_causal_pathway: "The team offense underperforms broadly, dragging multiple overs down together."
    candidate_interventions:
      - intervention_type: parlay_shared_failure_veto
        description: "Penalize same-team overs that all require a healthy team offense."
      - intervention_type: scenario_stress_increase
        description: "Increase downside stress for team-dependent overs."
    allowed_penalties_gates: [soft_downgrade, parlay_shared_failure_veto, scenario_stress_increase]
    opposite_side_discovery_rules: [require_valid_price]
    validation_segments: [TEAM_OFFENSE_COLLAPSE]
    promotion_requirements: [trained_bundle_replay_required, broader_walk_forward_required, no_op_narrowness_required, active_window_improvement_required]
    known_risks_overfit_traps: [single_game_outliers, double_counting_team_total, opponent_noise]
  - failure_mode_id: LOW_TEAM_ASSIST_ENVIRONMENT

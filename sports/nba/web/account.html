<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Analytics | Account</title>
    <meta name="nba-api-base" content="">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="vault/vault-tokens.css?v=10">
    <link rel="stylesheet" href="vault/vault-components.css?v=9">
    <link rel="stylesheet" href="styles.css?v=25">
</head>
<body class="vault-theme">
    <div id="vaultShellRoot"></div>
    <main class="vault-shell">
        <header class="vault-page-header">
            <p class="vault-page-kicker">Account</p>
            <div class="vault-heading-row">
                <h1>Account</h1>
                <button class="vault-info-trigger" type="button" aria-label="About Account" data-info="Plan access, entitlements, and API keys are controlled server-side. Frontend locks are visual only.">i</button>
            </div>
        </header>

        <section class="vault-board-toolbar" aria-label="Sign in">
            <label>
                Email
                <input id="accountEmail" type="email" placeholder="you@example.com" autocomplete="email">
            </label>
            <button type="button" id="accountLoginBtn" class="vault-door-cta">Dev sign-in</button>
            <button type="button" id="accountLogoutBtn" class="vault-sport-pill">Sign out</button>
        </section>

        <section id="accountSummary" class="vault-panel" style="padding:var(--vault-space-5);margin-bottom:var(--vault-space-6);"></section>

        <section id="apiKeySection" hidden>
            <h2>API Keys</h2>
            <div class="vault-board-toolbar">
                <input id="apiKeyName" type="text" placeholder="Key name">
                <button type="button" id="createApiKeyBtn" class="vault-door-cta">Create API key</button>
            </div>
            <pre id="apiKeyOnce" class="vault-disclaimer" hidden></pre>
            <div id="apiKeyList"></div>
        </section>
    </main>
    <script src="vault/vault-shell.js?v=9"></script>
    <script src="auth-client.js?v=1"></script>
    <script src="account.js?v=1"></script>
</body>
</html>

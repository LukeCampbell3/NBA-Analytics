<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080d13">
  <meta name="description" content="NBA-CV real-broadcast computer-vision demonstrations from In The Cards Analytics.">
  <title>NBA-CV | In The Cards Analytics</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080d13;color:#f5f7fa}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#080d13}
    body{display:flex;flex-direction:column;min-height:100vh}
    .bar{min-height:58px;display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid #233140;background:rgba(8,13,19,.96);position:sticky;top:0;z-index:3}
    .brand{font-weight:800;letter-spacing:.02em;color:#fff;text-decoration:none;white-space:nowrap}
    .crumb{color:#93a5b7;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .spacer{flex:1}
    .back,.external{color:#e8f4ff;text-decoration:none;border:1px solid #30465a;border-radius:9px;padding:8px 10px;font-size:.86rem;white-space:nowrap}
    .frame-wrap{position:relative;flex:1;min-height:calc(100vh - 58px);background:#070b10}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#070b10}
    .fallback{position:absolute;inset:0;display:grid;place-items:center;padding:32px;text-align:center;z-index:0;color:#a9b8c7}
    .fallback div{max-width:620px}
    .fallback h1{color:#fff;margin:0 0 12px}
    @media(max-width:700px){.crumb{display:none}.bar{gap:8px;padding:9px 10px}.back,.external{padding:7px 8px;font-size:.8rem}}
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/nba/predictions/">In The Cards · NBA-CV</a>
    <span class="crumb">Real broadcast computer vision · possession overlays</span>
    <span class="spacer"></span>
    <a class="back" href="/nba/predictions/">NBA Predictions</a>
    <a class="external" href="https://lukecampbell3.github.io/nba--cv/" target="_blank" rel="noopener noreferrer">Open viewer</a>
  </header>
  <main class="frame-wrap">
    <div class="fallback">
      <div>
        <h1>NBA-CV</h1>
        <p>Loading the hosted real-broadcast CV gallery. If your browser blocks embedded cross-site content, use “Open viewer” above.</p>
      </div>
    </div>
    <iframe
      src="https://lukecampbell3.github.io/nba--cv/"
      title="NBA-CV hosted broadcast analysis gallery"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="fullscreen"
      allowfullscreen></iframe>
  </main>
</body>
</html>
